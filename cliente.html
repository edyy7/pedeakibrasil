<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cliente · PedeAí Brasil</title>
<style>
:root{--bg:#0b0b0d;--cd:#16161a;--br:#2a2a31;--tx:#f4f4f6;--mu:#a3a3ad;--ac:#d4141c;--gd:#c99700;--ok:#22a559;--rd:#ff4d55;--yl:#e0a800}
@media(prefers-color-scheme:light){:root{--bg:#f6f6f8;--cd:#fff;--br:#dcdce3;--tx:#15151a;--mu:#5d5d68}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,sans-serif;padding-bottom:90px}
.pv{background:var(--gd);color:#000;font-size:13.5px;font-weight:800;padding:6px 12px;text-align:center}
.top{padding:12px 16px;border-bottom:1px solid var(--br)}.logo{font-size:21px;font-weight:800;line-height:1.1}
.addr{border:1px solid var(--br);background:var(--cd);color:var(--tx);border-radius:12px;padding:8px 12px;font:inherit;text-align:left;margin-top:8px;width:100%}.addr small{display:block;color:var(--mu);font-size:13.5px}
.pg{padding:4px 14px;max-width:720px;margin:0 auto}h2{margin:14px 0 6px;font-size:18px}
.oc,.card{background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:12px;margin:10px 0}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;color:var(--tx);font:inherit}.thumb{font-size:34px;width:52px;height:52px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.meta{color:var(--mu);font-size:15.5px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.free{color:var(--ok);font-weight:800}.star{color:var(--gd);font-weight:800}
.tag{font-size:13.5px;font-weight:800;border:1px solid var(--br);border-radius:999px;padding:2px 9px;white-space:nowrap}
.cta{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:10px;padding:13px 16px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:800}.cta.c{justify-content:center}
.cta.b{background:transparent;color:var(--ac);border:1px solid var(--ac)}.cta.o{background:transparent;color:var(--rd);border:1px solid var(--rd)}.cta:disabled{opacity:.45}
.add{border:0;background:var(--ac);color:#fff;border-radius:10px;font:inherit;font-weight:800;padding:8px 14px}.add:disabled{background:var(--br);color:var(--mu)}
input,select,textarea{width:100%;margin-top:6px;padding:11px;border-radius:10px;border:1px solid var(--br);background:var(--bg);color:var(--tx);font:inherit}
.search{margin:10px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.chip{flex:none;border:1px solid var(--br);background:var(--cd);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.back{border:1px solid var(--br);background:var(--cd);color:var(--tx);padding:8px 14px;border-radius:10px;font:inherit;margin:8px 0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:var(--bg);border-top:1px solid var(--br);z-index:5}.bar .cta{max-width:720px;margin:0 auto}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:8}
.panel{background:var(--bg);width:100%;max-width:720px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.line{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--br)}
.sel{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.sel button{flex:1;min-width:110px;padding:8px;border-radius:10px;border:1px solid var(--br);background:var(--cd);color:var(--tx);font:inherit;font-size:15.5px}.sel .on{border-color:var(--ac);color:var(--ac);font-weight:800}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--br);background:var(--cd);color:var(--tx);font:inherit}.seg .on{border-color:var(--ac);color:var(--ac);font-weight:800}
.step{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--mu)}.step i{width:22px;height:22px;border-radius:50%;border:2px solid var(--br);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13.5px}.step.d{color:var(--tx);font-weight:700}.step.d i{background:var(--ok);border-color:var(--ok);color:#fff}.step.n{color:var(--ac);font-weight:800}.step.n i{border-color:var(--ac)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;display:none;z-index:20}
</style><link rel="manifest" href="manifest-cliente.json"><meta name="theme-color" content="#d4141c"><link rel="icon" href="icon-cliente-192.png"><link rel="apple-touch-icon" href="icon-cliente-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><script src="marca.js"></script></head><body>
<div class="pv" id="pa-st" style="background:#111;color:#e0a800;font-size:12.5px;font-weight:700">○ Conectando…</div>
<div class="pg" id="inst"></div>
<div class="top"><div class="logo"><span style="color:#d4141c">Esse aplicativo pode ser</span> <span style="color:#c99700">seu</span></div><div id="ad"></div></div>
<div class="pg"><div id="v"></div></div>
<div id="bar"></div><div id="sheet"></div><div class="toast" id="t"></div>
<script>
const $=i=>document.getElementById(i),toast=m=>{const t=$("t");t.textContent=m;t.style.display="block";clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display="none",2200)};
const R$=n=>"R$ "+n.toFixed(2).replace(".",",");
const nz=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
/* Só existe UMA loja: o cliente vê apenas o cardápio (sem Marketplace, sem opções soltas de Entrega/Retirada, sem link da loja) */
let X={n:"Lanchonete do Zé",c:"Lanches",ic:"🍔",r:"4,8",t:"25–35 min",m:[["X-Burger",18,true,"Pão, hambúrguer, queijo e salada","🍔"],["Suco de laranja",8,true,"300 ml, natural","🥤"],["Batata frita",12,false,"Porção média","🍟"],["Pastel de carne",9,true,"Recheio caseiro","🥟"]]};
const X0=X;
const MKS=[];
let MKT=false,cur=null;
function mercado(){return `<h2>🛍️ Marketplace</h2><div class="meta">Todas as lojas aprovadas. Escolha onde pedir.</div>`+MKS.map((s,i)=>`<button class="card" onclick="abre(${i})"><div class="thumb">${s.ic}</div><div style="flex:1"><b>${s.n}</b><div class="meta"><span class="star">★ ${s.r}</span> · ${s.c} · ${s.t}</div><div class="meta">${s.m.length} ${s.tp=="agenda"?"serviços":"produtos"}</div></div>›</button>`).join("")}
function abre(i){cur=MKS[i];X=cur;cart=[];draw()}
function agenda(){return `<div class="oc"><b>📅 Agendamento</b><div class="meta">Escolha o serviço e o horário. Esta loja não tem entrega.</div></div>${AG.length?`<button class="card" style="border-color:var(--ac)" onclick="sh='mag';draw()"><div class="thumb" style="color:var(--ac)">📅</div><div><b>Meus agendamentos (${AG.length})</b><div class="meta">Ver, conferir e cancelar</div></div></button>`:""}<h2>Serviços</h2>`+X.m.map((p,i)=>`<div class="oc"><div class="row"><div><b>${p[0]}</b><div class="meta">${p[3]}</div></div><div style="text-align:right"><b>${R$(p[1])}</b><br>${p[2]?`<button class="add" onclick="agIni(${i})">Agendar</button>`:`<button class="add" disabled>Indisponível</button>`}</div></div></div>`).join("")}
/* ---------- AGENDAMENTO (dia → horário → confirmação → Meus agendamentos) ---------- */
let AG=[],ag=null,agN=1;
const HRS=["09:00","10:00","11:00","13:00","14:00","15:00","16:00","17:00"];
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const brd=t=>t.split("-").reverse().join("/");
function dias(){const o=[],h=new Date();h.setHours(0,0,0,0);for(let k=1;o.length<7;k++){const d=new Date(h);d.setDate(h.getDate()+k);if(d.getDay()==0)continue;o.push(d)}return o}
const ocup=(dia,hr)=>{const n=parseInt(dia.slice(8),10)+HRS.indexOf(hr);return n%4==0||AG.some(a=>a.dia==dia&&a.hr==hr&&a.loja==X.n)};
function agIni(i){ag={i,dia:"",hr:""};sh="agd";draw()}
function agDia(v){ag.dia=v;ag.hr="";draw()}
function agHr(v){ag.hr=v;draw()}
function agOk(){if(!ag||!ag.dia||!ag.hr){toast("Escolha o dia e o horário");return}const p=X.m[ag.i];ag.id=agN++;AG.push({id:ag.id,loja:X.n,serv:p[0],v:p[1],dia:ag.dia,hr:ag.hr});sh="agok";draw()}
function agCancela(id){AG=AG.filter(a=>a.id!=id);draw();toast("Agendamento cancelado");if(!AG.length){sh=null;draw()}}
function agSheet(){const p=X.m[ag.i],D=dias();return `<div class="panel"><b style="font-size:20px">Agendar · ${p[0]}</b><div class="meta">${X.n} · ${R$(p[1])}</div>
<div class="meta" style="margin-top:12px;font-weight:800">1. Escolha o dia</div><div class="chips">${D.map(d=>{const v=iso(d);return `<button class="chip ${ag.dia==v?"on":""}" onclick="agDia('${v}')">${d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"})}</button>`}).join("")}</div>
<div class="meta" style="font-weight:800">2. Escolha o horário</div>${ag.dia?`<div class="chips" style="flex-wrap:wrap">${HRS.map(h=>{const oc=ocup(ag.dia,h);return `<button class="chip ${ag.hr==h?"on":""}" ${oc?"disabled style=\"opacity:.4;text-decoration:line-through\"":""} onclick="agHr('${h}')">${h}</button>`}).join("")}</div><div class="meta">Horários riscados já estão ocupados.</div>`:`<div class="meta" style="margin:6px 0">Escolha primeiro o dia.</div>`}
${ag.dia&&ag.hr?`<div class="oc"><b>Resumo</b><div class="meta">${p[0]} · ${brd(ag.dia)} às ${ag.hr} · ${R$(p[1])}</div><div class="meta">Pagamento na loja, no dia do atendimento.</div></div>`:""}
<button class="cta c" ${ag.dia&&ag.hr?"":"disabled"} onclick="agOk()">Confirmar agendamento</button><button class="cta b c" onclick="sh=null;ag=null;draw()">Voltar aos serviços</button></div>`}
function agConf(){const a=AG[AG.length-1];return `<div class="panel"><b style="font-size:20px">✅ Agendamento confirmado</b><div class="oc" style="border-color:var(--ok)"><b>${a.serv}</b><div class="meta">${a.loja}</div><div class="meta" style="color:var(--tx);font-weight:800">${brd(a.dia)} às ${a.hr} · ${R$(a.v)}</div></div><div class="meta">A loja foi avisada. Você pode ver ou cancelar em Meus agendamentos.</div><button class="cta c" onclick="sh='mag';draw()">Ir para Meus agendamentos</button><button class="cta b c" onclick="sh=null;ag=null;draw()">Voltar aos serviços</button></div>`}
function agMeus(){return `<div class="panel"><b style="font-size:20px">📅 Meus agendamentos</b>${AG.map(a=>`<div class="oc"><div class="row"><b>${a.serv}</b><span class="tag" style="color:var(--ok)">Confirmado</span></div><div class="meta">${a.loja}</div><div class="meta" style="color:var(--tx);font-weight:800">${brd(a.dia)} às ${a.hr} · ${R$(a.v)}</div><button class="cta o c" onclick="agCancela(${a.id})">Cancelar agendamento</button></div>`).join("")||`<div class="meta" style="margin:8px 0">Você ainda não tem agendamentos.</div>`}<button class="cta c" onclick="sh=null;ag=null;draw()">Voltar aos serviços</button></div>`}
/* AUT = o que o ADM autoriza para esta loja */
let TS=0,AUT="ambas",taxa=false,cart=[],sh=null,pg="din",troco="",tipo="ent",pedido=null,st=0,asn="",vr="",pq=0,pnome="";
const TAXA=5;
const hx=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let PIXK="",ENDR=(()=>{try{return JSON.parse(localStorage.getItem("pa_end")||"{}")}catch(e){return{}}})();
function svEnd(){try{localStorage.setItem("pa_end",JSON.stringify(ENDR))}catch(e){}}
function pedeEnd(){const r=(prompt("Rua e número:",ENDR.rua||"")||"").trim();if(!r)return;const b=(prompt("Bairro:",ENDR.bairro||"")||"").trim();ENDR={...ENDR,rua:r,bairro:b};svEnd();draw()}
function usaGps(){if(!navigator.geolocation){toast("Este aparelho não informa a localização");return}navigator.geolocation.getCurrentPosition(p=>{ENDR.lat=p.coords.latitude;ENDR.lng=p.coords.longitude;svEnd();toast(ENDR.rua?"Localização salva junto com o endereço":"Localização salva. Informe também a rua e o número");draw()},()=>toast("Não foi possível obter a localização"),{enableHighAccuracy:true,timeout:10000})}
function copiaPix(b){const k=b.dataset.k||"";try{navigator.clipboard.writeText(k).then(()=>toast("Chave Pix copiada"))}catch(e){toast("Copie a chave manualmente")}}
/* Fora do raio: KMC = distância do cliente até a loja · RAIO = limite da loja · TX = taxa extra que a loja define ao aceitar · xs: 0 nada · 1 perguntou · 2 loja aceitou · 3 loja recusou */
let fora=false,xs=0;const KMC=7.4,RAIO=5,TX=4;
const ent=()=>AUT=="ambas",ret=()=>AUT=="ambas"||AUT=="ret",nada=()=>AUT=="nada";
function avisos(){if(nada())return `<div class="oc" style="border-color:var(--rd)"><b>Esta loja está fechada ou sem forma de recebimento liberada no momento.</b><div class="meta">Não é possível fazer pedidos agora.</div></div>`;
 return `<div class="oc">${ent()?`<div class="row"><b>🛵 Entrega disponível</b><span class="${taxa?"":"free"}">${taxa?"Taxa "+R$(TAXA):"Entrega grátis"}</span></div>`:""}${ret()?`<div class="row"><b>🏪 Retirada no local</b><span class="meta">${ent()?"também disponível":"só retirada"}</span></div>`:""}</div>`}
function pontoLoja(){return `<div class="card" style="cursor:default"><div class="thumb">${X.ic}</div><div style="flex:1"><b style="font-size:19px">${X.n}</b><div class="meta"><span class="star">★ ${X.r}</span> · ${X.c} · ${X.t}</div></div></div>`}
const foto=(p,z)=>`<div style="width:${z}px;height:${z}px;border-radius:14px;background:linear-gradient(135deg,var(--bg),var(--br));display:flex;align-items:center;justify-content:center;font-size:${Math.round(z*.52)}px;flex:none;overflow:hidden" role="img" aria-label="Foto de ${p[0]}">${p[4]||"🍽️"}</div>`;
function cardapio(){return avisos()+`<h2>Cardápio</h2>`+X.m.map((p,i)=>`<div class="oc"><div style="display:flex;gap:12px;align-items:center"><div style="position:relative">${foto(p,88)}${!p[2]?`<div style="position:absolute;inset:0;border-radius:14px;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center">Esgotado</div>`:""}</div><div style="flex:1;min-width:0"><b>${p[0]}</b>${p[3]?`<div class="meta">${p[3]}</div>`:""}<div class="row" style="margin-top:6px"><b>${R$(p[1])}</b>${nada()?`<button class="add" disabled>Indisponível</button>`:p[2]?`<button class="add" onclick="add(${i})">Adicionar</button>`:`<button class="add" disabled>Esgotado</button>`}</div></div></div></div>`).join("")+assist()}
function assist(){if(!asn||nada())return"";return `<div class="oc"><b>🎙️ ${asn}, sua atendente por voz</b><div class="meta" style="margin:4px 0">No celular você toca no botão e fala o pedido. Aqui, digite o que falaria: “quero dois x-burger”, “um suco”, “desfazer”, “é só isso”.</div><button class="cta b c" onclick="alert('Preview: em Chrome/Android este botão abre o microfone. Use a caixa de texto abaixo.')">🎙️ Falar com ${asn}</button><input id="vt" placeholder="Digite o que você falaria"><button class="cta c" onclick="fala($('vt').value)">Enviar</button><div class="meta" style="margin-top:8px">${vr}</div></div>`}
function add(i){cart.push({n:X.m[i][0],p:X.m[i][1]});draw();toast("Adicionado: "+X.m[i][0])}
function fala(txt){const t=" "+nz(txt)+" ";
 if(/ desfazer /.test(t)){const k=cart.pop();vr=k?"Desfeito. Mais alguma coisa?":"Não tenho nada para desfazer.";return draw()}
 if(/ so isso | e so | fechar /.test(t)){vr=cart.length?"Certo! Confira a sacola e toque em Fazer pedido.":"A sacola está vazia.";return draw()}
 const NUM={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4},ws=t.trim().split(" ");let a=null;
 X.m.forEach(p=>{if(!p[2])return;const tk=nz(p[0]).split(" ").filter(w=>w.length>2);if(tk.length&&tk.every(w=>ws.includes(w)))a={p,q:NUM[ws[ws.indexOf(tk[0])-1]]||1}});
 if(!a){vr="Não encontrei esse item no cardápio de hoje. Pode repetir?";return draw()}
 for(let i=0;i<a.q;i++)cart.push({n:a.p[0],p:a.p[1]});vr="Anotei "+(a.q>1?a.q+" ":"")+a.p[0]+(a.p[0]=="X-Burger"?". Quer uma bebida? Temos Suco de laranja.":". Mais alguma coisa?");draw()}
const LB=["Pedido enviado à loja","Loja aceitou e está preparando","Pronto: procurando entregador","Entregador a caminho da loja","Em rota até você","Entregue"];
const LBR=["Pedido enviado à loja","Loja aceitou e está preparando","Pronto para retirada","Retirado"];
function home(){const fin=pedido&&(pedido.tipo=="ret"?st>=3:st>=5)?`<button class="card" onclick="sh='trk';draw()"><div class="thumb" style="color:var(--ok)">✅</div><div><b>Pedido #${pedido.id} · ${pedido.tipo=="ret"?"Retirado":"Entregue"}</b><div class="meta">Ver detalhes ou reportar um problema</div></div></button>`:"";const trk=pedido&&(pedido.tipo=="ret"?st<3:st<5)?`<button class="card" style="border-color:var(--ac)" onclick="sh='trk';draw()"><div class="thumb" style="color:var(--ac)">${pedido.tipo=="ret"?"🏪":"🛵"}</div><div><b>Acompanhar pedido #${pedido.id}</b><div class="meta">${(pedido.tipo=="ret"?LBR:LB)[st]}</div></div></button>`:"";if(MKT&&!cur)return trk+fin+mercado();return (MKT?`<button class="back" onclick="cur=null;X=X0;cart=[];draw()">‹ Marketplace</button>`:"")+trk+fin+pontoLoja()+(X.tp=="agenda"?agenda():cardapio())}
const sub=()=>cart.reduce((t,i)=>t+i.p,0);
function sacola(){const SIMPLES=!(window.PA_brand&&window.PA_brand.checkoutSimples===false);const m={};cart.forEach(i=>{m[i.n]=m[i.n]||{...i,q:0};m[i.n].q++});const it=Object.values(m),tt=sub();
 if(!ent())tipo="ret";const fr=tipo=="ent"&&taxa?TAXA:0,blk=tipo=="ent"&&fora&&xs!=2,ex=tipo=="ent"&&fora&&xs==2?TX:0,tot=tt+fr+ex+TS;
 const opc=nada()?`<div class="oc" style="border-color:var(--rd)"><b>Sem forma de recebimento disponível</b><div class="meta">Esta loja não tem entrega nem retirada liberadas. Não é possível finalizar o pedido.</div></div>`:
