<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criador · PedeAí Brasil</title>
<style>
:root{--bg:#0b0b0d;--cd:#16161a;--br:#2a2a31;--tx:#f4f4f6;--mu:#a3a3ad;--ac:#d4141c;--gd:#c99700;--ok:#22a559;--rd:#ff4d55;--yl:#e0a800}
@media(prefers-color-scheme:light){:root{--bg:#f6f6f8;--cd:#fff;--br:#dcdce3;--tx:#15151a;--mu:#5d5d68}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,sans-serif;padding-bottom:40px}
.pv{background:var(--gd);color:#000;font-size:13.5px;font-weight:800;padding:6px 12px;text-align:center}
.top{padding:12px 16px;font-weight:800;color:var(--ac);border-bottom:1px solid var(--br)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px}.tabs button{flex:none;border:1px solid var(--br);background:var(--cd);color:var(--tx);padding:10px 14px;border-radius:999px;font:inherit;font-weight:700}.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pg{padding:4px 14px;max-width:720px;margin:0 auto}h2{margin:14px 0 6px;font-size:18px}
.card{background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:12px;margin:10px 0}.card.al{border-color:var(--rd)}
.meta,.lbl{color:var(--mu);font-size:15.5px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>div{background:var(--bg);border:1px solid var(--br);border-radius:12px;padding:10px}.num{font-size:24px;font-weight:800}
.tag{font-size:13.5px;font-weight:800;border:1px solid var(--br);border-radius:999px;padding:2px 9px;white-space:nowrap}
.summ{display:block;width:100%;text-align:left;background:var(--cd);border:1px solid var(--ac);border-radius:14px;padding:14px;margin:10px 0;color:var(--tx);font:inherit}.summ .more{color:var(--ac);font-weight:800;margin-top:6px}
button.cta,.cta{display:flex;justify-content:center;width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:800}
.cta.o{background:transparent;color:var(--rd);border:1px solid var(--rd)}.cta.b{background:transparent;color:var(--ac);border:1px solid var(--ac)}.cta.g{background:var(--ok)}
.sec{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--br);background:var(--cd);color:var(--tx);font:inherit;font-weight:700}
.tg{flex:none;padding:10px 16px;border-radius:999px;border:0;font:inherit;font-weight:800;background:#777;color:#fff}.tg.on{background:var(--ok)}
input,select{width:100%;margin-top:6px;padding:11px;border-radius:10px;border:1px solid var(--br);background:var(--bg);color:var(--tx);font:inherit}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:8}
.mbox{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:14px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.mhead button{border:1px solid var(--br);background:var(--cd);color:var(--tx);border-radius:10px;padding:8px 14px;font:inherit;font-weight:800}
.item{display:block;width:100%;text-align:left;background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:12px;margin:8px 0;color:var(--tx);font:inherit}
.ok{color:var(--ok)}.bad{color:var(--rd)}.foot{text-align:center;color:var(--mu);font-size:13.5px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;display:none;z-index:20}
</style><link rel="manifest" href="manifest-criador.json"><meta name="theme-color" content="#6b46c1"><link rel="icon" href="icon-criador-192.png"><link rel="apple-touch-icon" href="icon-criador-192.png"><meta name="apple-mobile-web-app-capable" content="yes"></head><body>
<div class="pv" id="pa-st" style="background:#111;color:#e0a800;font-size:12.5px;font-weight:700">Conectando…</div>
<div class="pg" id="inst"></div>
<div class="top">Criador · painel mestre</div>
<div class="tabs" id="tabs"></div><div class="pg" id="v"></div>
<div id="modal"></div><div class="toast" id="t"></div>
<script>
const $=i=>document.getElementById(i),toast=m=>{const t=$("t");t.textContent=m;t.style.display="block";clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display="none",2200)};
const R$=n=>"R$ "+Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let nEv=0,txBt="",nLeads=0,tab="adm",mod=null,det=null,busca="",D=null,erro="",tD=0,repAba="pend",repF="",afSel=null,vincSlug=null,lastMK="";
const TABS=[["adm","👑 ADMs"],["fat","💰 Faturamento"],["trv","🔓 Travas"],["bkp","💾 Backup"],["msg","📨 Mensagens"],["cfg","⚙️ Configurações"]];
window.PA_onEventos=n=>{nEv=n;draw()};window.PA_onLeads=n=>{nLeads=n;draw()};window.PA_onBt=t=>{txBt=t;draw()};
function go(k){const a=window.PA_criadorAcoes;if(!a){toast("Aguarde a conexão e o login do Criador");return}a[k]()}
async function carregar(){if(!window.PA_criadorDados)return;try{D=await PA_criadorDados();erro="";tD=Date.now()}catch(e){console.error(e);erro="Não foi possível ler os dados agora."}draw()}
window.PA_onCriadorPronto=()=>{carregar().then(()=>{window.PA_criadorLive&&PA_criadorLive()})};
window.PA_onPedidos=l=>{if(!D)return;D.pedidos=l;if(tab==="fat")draw("k")};
window.PA_onLojas=l=>{if(!D)return;D.lojas=l;if(tab==="fat")draw("k")};
window.PA_onComissoes=l=>{if(!D)return;D.comissoes=l;draw()};window.PA_onAfiliados=l=>{if(!D)return;D.afiliados=l;draw()};
const PL=()=>window.PA_PLANOS||{};
const dia0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const lojista=l=>D.contas.find(c=>c.papel==="lojista"&&c.loja&&c.loja.slug===l.slug);
const vencDe=l=>{const c=lojista(l);return c&&c.venc?c.venc:0};
const vencida=l=>{const v=vencDe(l);return !!v&&v<Date.now()};
const entregue=p=>p.st==="entregue"||p.st==="retirado";
const hojeDe=l=>D.pedidos.filter(p=>p.loja===l.slug&&p.criadoEm>=dia0()).length;
const stl=l=>l.suspensa?["Suspensa","bad"]:l.pendente?["Aguardando gerente",""]:vencida(l)?["Plano vencido","bad"]:["Ativa","ok"];
const dt=ms=>ms?new Date(ms).toLocaleDateString("pt-BR"):"—";
const row=(a,b)=>`<div class="row"><span>${a}</span><b>${b}</b></div>`;
const tile=(n,l)=>`<div><div class="num">${n}</div><div class="lbl">${l}</div></div>`;
const carr=()=>`<div class="card"><div class="meta">${erro||"Carregando dados reais…"}</div></div>`;
function adm(){if(!D)return carr();
 const A=D.contas.filter(c=>c.papel==="adm"),M=D.contas.filter(c=>c.papel==="motoboy"),LJ=D.lojas,LC=D.contas.filter(c=>c.papel==="lojista");
 const ped=D.pedidos.filter(p=>p.criadoEm>=dia0()).length;
 return `<div class="card"><b style="font-size:20px">Visão do sistema</b>${row("ADMs (contas com poder de ADM)",A.length)}${row("Lojas (total · suspensas)",LJ.length+" · "+LJ.filter(x=>x.suspensa).length)}${row("Lojas com plano vencido",LJ.filter(vencida).length)}${row("Pedidos hoje (todas as lojas)",ped)}</div>
 <button class="summ" onclick="mod='motos';draw()"><div class="lbl">Total de Motoboys no Sistema</div><div class="num">${M.length}</div><div class="more">Toque para ver a lista ›</div></button>
 <div class="card"><b>Por tipo de conta</b>${row("Lojas",LC.length)}${row("ADMs",A.length)}${row("Entregadores",M.length)}</div>`}
const pctDe=l=>{const t=window.PA_COMISSAO_PCT||{};const v=t[l.plano||"iniciante"];return typeof v==="number"?v:7};
function comissaoLojas(){const tot={};D.pedidos.forEach(p=>{if(entregue(p))tot[p.loja]=(tot[p.loja]||0)+(Number(p.tt)||0)});
 return D.lojas.map(l=>{const v=tot[l.slug]||0,pc=pctDe(l);return {l,v,pc,c:Math.round(v*pc)/100,ini:(l.plano||"iniciante")==="iniciante"}}).sort((a,b)=>b.c-a.c)}
function comissaoHtml(){const L=comissaoLojas(),T=L.reduce((a,o)=>a+o.c,0);
 return `<div class="card"><b style="font-size:20px">🏷️ Comissão do Criador por loja</b><div class="lbl">Acumulado sobre tudo que cada loja já vendeu (pedidos entregues/retirados), com a % do plano da loja. Atualiza sozinho a cada venda. Não é o valor recebido pela loja.</div><div class="row" style="margin-top:8px"><span>Total acumulado (todas as lojas)</span><b class="ok">${R$(T)}</b></div></div>
 ${L.map(o=>`<div class="card" style="${o.ini?"border:2px solid var(--gd);background:rgba(201,151,0,.10)":""}"><div class="row"><b>${esc(o.l.nome||o.l.slug)}</b><span class="tag">${esc((PL()[o.l.plano||"iniciante"]||{}).n||"")}</span></div>${row("Total vendido",R$(o.v))}${row("% do Criador",o.pc.toLocaleString("pt-BR")+"%")}<div class="row"><span>${o.ini?"⭐ ":""}Comissão acumulada</span><b class="${o.ini?"":"ok"}" style="font-size:${o.ini?"22":"17"}px;${o.ini?"color:var(--gd)":""}">${R$(o.c)}</b></div></div>`).join("")||`<div class="meta">Nenhuma loja.</div>`}`}
function fat(){if(!D)return carr();
 const pend=D.contas.filter(c=>c.pagto&&c.pagto.st==="analise"),P=PL(),t30=Date.now()-30*864e5;
 const ent=D.pedidos.filter(p=>entregue(p)&&p.criadoEm>=t30),vol=ent.reduce((t,p)=>t+(Number(p.tt)||0),0);
 const mens=D.lojas.reduce((t,l)=>{const p=P[l.plano||"iniciante"]||{p:0,d:30};return t+p.p*30/p.d},0);
 const now=Date.now(),ven7=D.lojas.filter(l=>{const v=vencDe(l);return v&&v>=now&&v<=now+7*864e5}).length;
 return repasseCard()+comissaoHtml()+`<div class="card"><b style="font-size:20px">💠 Pix de mensalidades</b><div class="lbl">A confirmação do recebimento continua em “Contas e pagamentos”.</div></div>
 <h2>Aguardando sua confirmação (${pend.length})</h2>
 ${pend.map(c=>`<div class="card al"><div class="row"><b>${esc(c.nome||c.email)}</b><span class="tag">Em análise</span></div><div class="meta">${esc(c.papel)}${c.loja?" · "+esc(c.loja.nome):""} · ${esc(((c.papel==="adm"?window.PA_ADMP:P)||{})[(c.pagto&&c.pagto.plano)||"iniciante"]?.n||"")} ${c.pagto&&c.pagto.valor?"· "+R$(c.pagto.valor):""}</div></div>`).join("")||"<div class='meta'>Nenhum Pix em análise.</div>"}
 ${pend.length?`<button class="cta g" onclick="go('contas')">Confirmar em Contas e pagamentos</button>`:""}
 <div class="card"><b style="font-size:20px">Faturamento do sistema (últimos 30 dias)</b><div class="lbl">Calculado dos pedidos entregues e dos planos das lojas. Não substitui o extrato do Pix.</div><div class="grid" style="margin-top:10px">${tile(ent.length,"Pedidos entregues")}${tile(R$(vol),"Volume vendido")}${tile(R$(vol*.07),"Comissão estimada (7%)")}${tile(R$(mens),"Mensalidades por mês (planos)")}</div></div>
 <div class="card"><b>Planos das lojas</b>${row("Lojas cadastradas",D.lojas.length)}${row("Planos vencidos",D.lojas.filter(vencida).length)}${row("Vencem em até 7 dias",ven7)}</div>
 <button class="summ" onclick="mod='fat';draw()"><div class="lbl">Faturamento por loja (30 dias)</div><div class="num">${D.lojas.length}</div><div class="lbl">lojas cadastradas</div><div class="more">Toque para ver cada loja ›</div></button>`}
function trv(){if(!D)return carr();
 return `<div class="card"><b style="font-size:20px">Lojas do sistema</b><div class="grid" style="margin-top:10px">${tile(D.lojas.length,"Total de lojas")}${tile(D.lojas.filter(x=>x.suspensa).length,"Suspensas")}${tile(D.lojas.filter(vencida).length,"Plano vencido")}${tile(D.pedidos.filter(p=>p.criadoEm>=dia0()).length,"Pedidos hoje (todas)")}</div><button class="sec" onclick="mod='lojas';det=null;busca='';draw()">Ver lojas ›</button></div>`}
function bkp(){return `<div class="card"><b style="font-size:20px">💾 Backup mestre</b><div class="lbl" style="margin-top:6px">Ainda não ligado nesta versão: o arquivo de backup (lojas, motoboys e pedidos dos últimos 30 dias) não existe no app. A aba já está no lugar para quando for construído.</div></div>`}
function msg(){return `<div class="card"><b style="font-size:20px">📨 Caixa de entrada</b><div class="lbl" style="margin-top:6px">Ainda não ligada nesta versão: a mensagem do ADM para o Criador (hierarquia Loja → ADM → Criador) não existe no app. A aba já está no lugar para quando for construída.</div></div>`}
function cfg(){const P=PL(),AP=window.PA_ADMP||{},m=/\((\d+)\)/.exec(txBt||""),nc=m?+m[1]:0,u=(window.PA&&PA.user)||{};
 return `<div class="card"><b style="font-size:20px">💳 Contas e pagamentos${nc?` (${nc} aguardando)`:""}</b><div class="meta">Confirmar Pix recebidos, vencimentos, liberar ou travar lojas e ADMs.</div><button class="cta" onclick="go('contas')">Abrir</button></div>
<div class="card"><b style="font-size:20px">🏪 Lojas e dados${nEv?` (${nEv} nova${nEv>1?"s":""})`:""}</b><div class="meta">Lojas criadas pelos ADMs, excluir loja, zerar vendas, lucros e carteira e Reset Total (estado de fábrica, com 3 confirmações).</div><button class="cta" onclick="go('lojas')">Abrir</button></div>
<div class="card"><b style="font-size:20px">🤝 Programa de Afiliados</b><div class="meta">Afiliados se cadastram sozinhos (Sou Afiliado + Google). Aqui você vê cada um, ajusta a % (regra oficial 60/40), a situação e o histórico de comissões.</div><button class="cta" onclick="mod='afi';draw()">Abrir</button></div>
<div class="card"><b style="font-size:20px">🔗 Links de pagamento</b><div class="meta">Cadastre os links e ligue ou desligue o redirecionamento no checkout.</div><button class="cta" onclick="go('pag')">Abrir</button></div>
<div class="card"><b style="font-size:20px">🧩 Módulos e preço por loja</b><div class="meta">Liga e desliga Gestão, Loja Virtual e Agendamento de cada loja. O total muda conforme você liga os módulos.</div><button class="cta" onclick="go('mod')">Abrir</button></div>
<div class="card"><b style="font-size:20px">📩 Leads do site${nLeads?` (${nLeads} novo${nLeads>1?"s":""})`:""}</b><div class="meta">Pedidos de site personalizado e APK feitos pelo formulário do site.</div><button class="cta" onclick="go('leads')">Abrir</button></div>
<div class="card"><b>👤 Perfil do Criador</b><div class="meta" style="margin-top:4px">${esc(u.displayName||"Criador")} · ${esc(u.email||"")}<br>A chave Pix e os valores ficam em Contas e pagamentos.</div></div>
<div class="card"><b>💳 Planos e valores (os da cobrança atual)</b>${Object.keys(P).map(k=>row("Loja · "+esc(P[k].n),P[k].p?R$(P[k].p):"sem mensalidade")).join("")}${Object.keys(AP).map(k=>row("ADM · "+esc(AP[k].n),AP[k].p?R$(AP[k].p):"sem mensalidade")).join("")}</div>
<div class="card"><b>🔔 Avisos</b><div class="meta" style="margin:4px 0">Som, vibração e notificação quando entra pagamento ou loja nova.</div><button class="sec" onclick="window.PA_aviso&&PA_aviso('🔔 Teste','Aviso de teste do Criador');toast('Aviso de teste enviado')">Testar aviso</button></div>
<div class="card"><b>🎛️ Controles do sistema</b><div class="meta" style="margin-top:4px">Motoboys globais e Pagamentos ON/OFF: ainda não ligados nesta versão.</div></div>
<button class="sec" style="margin-top:14px" onclick="PA.logout&&PA.logout()">Sair</button>`}
function lojas(){const q=busca.toLowerCase(),l=D.lojas.filter(x=>((x.nome||x.slug)+" "+((lojista(x)||{}).nome||"")+" "+((lojista(x)||{}).email||"")).toLowerCase().includes(q));
 return `<input id="bq" placeholder="Buscar loja por nome ou responsável" value="${esc(busca)}" oninput="busca=this.value;draw(true)">
 ${l.map(x=>{const s=stl(x);return `<button class="item" onclick="det='${esc(x.slug)}';draw()"><div class="row"><b>${esc(x.nome||x.slug)}</b><span class="tag ${s[1]}">${s[0]}</span></div><div class="meta">${hojeDe(x)} pedido(s) hoje · plano ${esc((PL()[x.plano||"iniciante"]||{}).n||"")}</div></button>`}).join("")||`<div class="meta">Nenhuma loja encontrada.</div>`}`}
function detalhe(x){const s=stl(x),c=lojista(x)||{},v=vencDe(x);
 return `<div class="card">${row("Responsável",esc(c.nome||c.email||"—"))}${row("Situação",`<span class="${s[1]}">${s[0]}</span>`)}${row("Plano",esc((PL()[x.plano||"iniciante"]||{}).n||"")+(v?" · vence "+dt(v):""))}${row("Pedidos hoje",hojeDe(x))}</div>
 ${indicadorLoja(x)}
 <button class="cta ${x.suspensa?"g":"o"}" onclick="suspender('${esc(x.slug)}')">${x.suspensa?"Reativar loja":"Suspender loja"}</button>
 <button class="cta b" onclick="go('contas')">Vencimento e pagamento: Contas e pagamentos</button>
 <div class="meta" style="margin-top:10px">Excluir loja e dados: Configurações → Lojas e dados.</div>`}
async function suspender(slug){const x=D.lojas.find(l=>l.slug===slug);if(!x)return;const nv=!x.suspensa;if(!confirm((nv?"Suspender ":"Reativar ")+(x.nome||slug)+"?"))return;
 try{await PA_criadorSuspender(slug,nv);x.suspensa=nv;draw();toast(nv?"Loja suspensa":"Loja reativada")}catch(e){console.error(e);toast("Não foi possível alterar agora")}}
function modal(){const mm=modalAfi();if(mm)return mm;let t="",b="",voltar=false;
 if(mod==="motos"){t="Motoboys no sistema";b=D.contas.filter(c=>c.papel==="motoboy").map(c=>`<div class="card"><b>${esc(c.nome||c.email)}</b><div class="meta">${esc(c.email||"")}</div></div>`).join("")||`<div class="meta">Nenhum motoboy cadastrado.</div>`}
 else if(mod==="fat"){t="Faturamento por loja (30 dias)";const t30=Date.now()-30*864e5;b=D.lojas.map(l=>{const ps=D.pedidos.filter(p=>p.loja===l.slug&&entregue(p)&&p.criadoEm>=t30),f=ps.reduce((a,p)=>a+(Number(p.tt)||0),0);return {l,ps,f}}).sort((a,b)=>b.f-a.f).map(o=>`<div class="card"><div class="row"><b>${esc(o.l.nome||o.l.slug)}</b><b>${R$(o.f)}</b></div><div class="meta">${o.ps.length} pedidos · comissão ${R$(o.f*.07)} · plano ${esc((PL()[o.l.plano||"iniciante"]||{}).n||"")}</div></div>`).join("")||`<div class="meta">Nenhuma loja.</div>`}
 else if(det){const x=D.lojas.find(y=>y.slug===det);if(!x){det=null;return ""}t=x.nome||x.slug;voltar=true;b=detalhe(x)}
 else{t="Lojas do sistema";b=lojas()}
 return `<div class="modal" onclick="if(event.target===this){mod=null;det=null;draw()}"><div class="mbox"><div class="mhead">${voltar?`<button onclick="det=null;draw()">‹ Voltar</button>`:`<span></span>`}<b>${esc(t)}</b><button onclick="mod=null;det=null;draw()">✕</button></div>${b}</div></div>`}

/* ===== v5.9.7 · #008 Programa de Afiliados (repasses, baixa manual, indicadores, vínculo da loja) ===== */
const AFS=()=>(D&&D.afiliados)||[],CMS=()=>(D&&D.comissoes)||[],afDe=id=>AFS().find(a=>a.id===id);
const pendentes=()=>CMS().filter(c=>c.st!=="paga").sort((a,b)=>(a.prazoEm||0)-(b.prazoEm||0));
const prazoTxt=c=>{const h=Math.round(((c.prazoEm||0)-Date.now())/36e5);return h>=0?"⏳ pagar em até "+h+" h (até "+dt(c.prazoEm)+")":"⏰ ATRASADO há "+(-h)+" h (prazo era "+dt(c.prazoEm)+")"};
const linkRef=a=>location.origin+"/?ref="+encodeURIComponent(a.cod||"");
