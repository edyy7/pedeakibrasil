<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PedeAí Brasil</title>
<style>body{margin:0;background:#0b0b0d;color:#f4f4f6;font:17px/1.4 system-ui,sans-serif;padding:24px;max-width:560px;margin:auto}a{display:block;margin:12px 0;padding:16px;border-radius:14px;background:#16161a;border:1px solid #2a2a31;color:#f4f4f6;text-decoration:none;font-weight:800}small{display:block;color:#a3a3ad;font-weight:400}</style></head><body>
<h1 id="tt">PedeAí Brasil</h1><div id="ac" style="display:none"><input id="acv" autocomplete="off" autocapitalize="none" placeholder="" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2a2a31;background:#0b0b0d;color:#f4f4f6;font:inherit"></div><p style="color:#a3a3ad">Abra o app de cada papel e instale pelo botão “Baixar e instalar”.</p>
<a href="site.html">🌐 Conheça o sistema<small>para lojas, salões e consultórios</small></a><a href="cliente.html">🛒 Cliente<small>faz pedidos</small></a><a href="lojista.html">🏪 Loja<small>recebe e prepara pedidos</small></a><a href="garcom.html">🍽️ Garçom<small>lança pedidos na mesa</small></a><a href="motoboy.html">🛵 Entregador<small>aceita e entrega</small></a><a href="adm.html">🧑‍💼 ADM<small>ocorrências e gestão</small></a><script>
/* Entrada oculta do Criador: /criador (web) ou 5 toques no título e digitar o caminho (celular) */
(function(){var n=0,tm,t=document.getElementById("tt"),b=document.getElementById("ac"),i=document.getElementById("acv");
t.addEventListener("click",function(){n++;clearTimeout(tm);tm=setTimeout(function(){n=0},1500);if(n>=5){n=0;b.style.display="block";i.focus()}});
i.addEventListener("keydown",function(e){if(e.key==="Enter"){var v=i.value.trim().toLowerCase().replace(/^\//,"");if(v==="criador")location.href="criador.html";else{i.value="";b.style.display="none"}}})})();
</script></body></html>
