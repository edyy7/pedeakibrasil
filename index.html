/* ===== Grupo dos entregadores ===== */
.gpbtn{position:relative;display:flex;align-items:center;gap:12px;width:100%;margin:0 0 14px;padding:12px 14px;border-radius:20px;text-align:left;color:#fff;background:linear-gradient(135deg,#0b46c4,#002776);border:2px solid #e0b030;box-shadow:0 10px 24px rgba(0,39,118,.38);transition:transform .12s}
.gpbtn:active{transform:scale(.98)}
.gpbtn .gpi{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.16);font-size:24px}
.gpbtn .gpt{flex:1;min-width:0}.gpbtn b{display:block;font-size:16px}.gpbtn small{display:block;font-size:13px;opacity:.85}
.gpbtn em{font-style:normal;min-width:24px;padding:2px 8px;border-radius:999px;background:#e0b030;color:#1b1b1b;font-size:13px;font-weight:800;text-align:center}
.gpbtn .gpa{font-size:26px;font-weight:800;opacity:.9}
.gphead{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 14px;color:#fff;border-radius:0 0 24px 24px;
  background:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(135deg,#e23a41 0%,#a30d14 45%,#0b46c4 100%);box-shadow:0 10px 26px rgba(0,39,118,.35),0 3px 0 #e0b030}
.gpback{flex:none;padding:10px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:15px}
.gphead b{display:block;font-size:17px}.gphead small{display:block;font-size:13px;opacity:.9}
.gpmsgs{padding:14px 14px 110px;min-height:60vh}
.gpday{width:max-content;margin:12px auto 6px;padding:3px 12px;border-radius:999px;background:var(--sf);border:1px solid var(--br);font-size:12.5px;font-weight:700;color:var(--mu)}
.gpm{display:flex;justify-content:flex-start;margin:7px 0}.gpm.me{justify-content:flex-end}
.gpb{max-width:84%;min-width:96px;padding:8px 12px 6px;border-radius:18px 18px 18px 6px;background:var(--sf);border:1px solid var(--br);box-shadow:0 4px 12px rgba(0,39,118,.08);font-size:16px;word-break:break-word}
.gpm.me .gpb{border-radius:18px 18px 6px 18px;border:0;color:#fff;background:linear-gradient(135deg,#e23a41,#a30d14);box-shadow:0 6px 16px rgba(163,13,20,.3)}
.gpb small{display:block;font-size:12.5px;font-weight:800;color:#0b46c4}.gpm.me .gpb small{color:#e0b030}
:root[data-theme="dark"] .gpb small{color:#7fb0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gpb small{color:#7fb0ff}}
.gpb audio{display:block;width:100%;min-width:200px;height:40px;margin:6px 0 2px}
.gpts{display:block;text-align:right;font-size:11.5px;opacity:.7;margin-top:2px}
.gpbar{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:3px solid #e0b030;box-shadow:0 -8px 24px rgba(0,39,118,.18)}
.gpbar input{flex:1;min-width:0;margin:0;padding:12px 16px;border:1.5px solid var(--br);border-radius:999px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.gpbar input:focus{outline:0;border-color:#e23a41;box-shadow:0 0 0 4px rgba(226,58,65,.22)}
.gpmic{flex:none;width:44px;height:44px;border-radius:50%;font-size:21px;display:grid;place-items:center;background:linear-gradient(135deg,#0b46c4,#002776);box-shadow:0 5px 14px rgba(0,39,118,.4)}
.gprec{flex:1;display:flex;align-items:center;gap:10px;font-weight:800}
.gprec i{width:14px;height:14px;border-radius:50%;background:#ff3b30;box-shadow:0 0 0 5px rgba(255,59,48,.25);animation:gprec 1s ease-in-out infinite}
.gprec b{flex:1;font-variant-numeric:tabular-nums}
@keyframes gprec{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.gprec i{animation:none}}

/* barra de perfil sem cortar botões em telas estreitas */
.roles>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roles button{padding:8px 11px!important;font-size:13.5px!important;white-space:nowrap}

.vgrow{display:flex;gap:8px;align-items:center}.vgrow input{flex:1;min-width:0;margin:0!important}.vgrow .cta{flex:none;width:auto;min-height:48px;padding:0 22px;justify-content:center}

/* ===================================================================
   COCKPIT DO ENTREGADOR — área moderna e futurista (só no perfil entregador, html.ent-fx)
   Paleta escura com verde neon, amarelo e azul; vidro, brilho e radar.
   =================================================================== */
html.ent-fx:root{--bg:#050507;--sf:#14141b;--tx:#eaf1ff;--mu:#8fa6d6;--br:#1b2f66;--ac:#e0b030;--ok:#e0b030;--rd:#ff6b5e;--yl:#e0b030;--glow:0 8px 24px rgba(224,176,48,.32);color-scheme:dark;background:#050507}
html.ent-fx body{background:radial-gradient(90% 38% at 85% -4%,rgba(224,176,48,.22),transparent 62%),radial-gradient(80% 42% at 0 100%,rgba(11,70,196,.32),transparent 62%),linear-gradient(rgba(120,170,255,.045) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(120,170,255,.045) 1px,transparent 1px) 0 0/28px 28px,#050507;background-attachment:fixed;color:#eaf1ff}
html.ent-fx .roles.rent{background:linear-gradient(180deg,rgba(4,12,36,.96),rgba(6,18,50,.82));backdrop-filter:blur(16px);border-bottom:1px solid rgba(224,176,48,.45);box-shadow:0 10px 30px rgba(0,0,0,.5),0 2px 0 rgba(224,176,48,.55)}
html.ent-fx .roles.rent>span{font-family:"Orbitron","Poppins",system-ui,sans-serif;letter-spacing:.06em;color:#e0b030!important;text-shadow:0 0 14px rgba(224,176,48,.6)}
html.ent-fx .roles.rent button{background:rgba(224,176,48,.1);border:1px solid rgba(224,176,48,.5);color:#eaf1ff;box-shadow:0 0 12px rgba(224,176,48,.12)}
html.ent-fx .ehero{border-radius:26px;padding:20px 16px 16px;background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(140deg,rgba(11,70,196,.78) 0%,rgba(0,39,118,.9) 55%,rgba(2,18,60,.95) 100%);border:1px solid rgba(130,180,255,.38);box-shadow:0 20px 44px rgba(0,0,0,.55),0 0 0 1px rgba(224,176,48,.18),inset 0 1px 0 rgba(255,255,255,.2)}
html.ent-fx .ehero::before{background:#e0b030;opacity:.18;filter:blur(1px)}
html.ent-fx .ehero::after{background:transparent;border:2px solid rgba(224,176,48,.55);box-shadow:0 0 22px rgba(224,176,48,.55),inset 0 0 14px rgba(224,176,48,.35);opacity:1}
html.ent-fx .hi{font-family:"Orbitron","Poppins",system-ui,sans-serif;font-size:21px;font-weight:800;letter-spacing:.02em;text-shadow:0 2px 14px rgba(0,0,0,.45)}
html.ent-fx .hs{color:#bcd0ff;opacity:1}
html.ent-fx .pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px)}
html.ent-fx .pill.on{border-color:rgba(224,176,48,.8);box-shadow:0 0 18px rgba(224,176,48,.45);background:rgba(224,176,48,.14)}
html.ent-fx .pill.on i{background:#e0b030;box-shadow:0 0 0 4px rgba(224,176,48,.3),0 0 12px #e0b030}
html.ent-fx .stats>div{background:rgba(5,5,7,.55);border:1px solid rgba(130,180,255,.28);border-radius:16px;backdrop-filter:blur(8px)}
html.ent-fx .stats b{font-family:"Orbitron","Poppins",system-ui,sans-serif;font-size:16px;color:#e0b030;text-shadow:0 0 12px rgba(224,176,48,.55)}
html.ent-fx .stats>div:last-child b{color:#e0b030;text-shadow:0 0 12px rgba(224,176,48,.5)}
html.ent-fx .gpbtn{border:1.5px solid rgba(224,176,48,.85);background:linear-gradient(135deg,rgba(11,70,196,.85),rgba(0,39,118,.95));box-shadow:0 12px 28px rgba(0,0,0,.5),0 0 22px rgba(11,70,196,.55)}
html.ent-fx .etabs{background:rgba(8,20,52,.85);border:1px solid rgba(130,180,255,.28);border-radius:20px;box-shadow:inset 0 0 18px rgba(11,70,196,.2),0 8px 24px rgba(0,0,0,.4)}
html.ent-fx .etabs button{color:#8fa6d6}
html.ent-fx .etabs .on{color:#fff;background:linear-gradient(135deg,#e94a50,#0b46c4);box-shadow:0 0 20px rgba(224,176,48,.45),0 6px 16px rgba(11,70,196,.45)}
html.ent-fx .etabs em{background:#e0b030;color:#101010;box-shadow:0 0 10px rgba(224,176,48,.6)}
html.ent-fx .ocE{background:linear-gradient(160deg,rgba(14,32,76,.94),rgba(6,16,44,.96));border:1px solid rgba(110,160,255,.3);border-radius:24px;box-shadow:0 16px 36px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
html.ent-fx .ocE::before{width:5px;background:linear-gradient(#e0b030,#0b46c4);box-shadow:0 0 14px rgba(224,176,48,.8)}
html.ent-fx .elist.and .ocE::before{background:linear-gradient(#e0b030,#ff9f1a);box-shadow:0 0 14px rgba(224,176,48,.7)}
html.ent-fx .ocE .tag{background:linear-gradient(135deg,#f0c85a,#e0b030);color:#101010;box-shadow:0 0 14px rgba(224,176,48,.45)}
html.ent-fx .pt i{background:rgba(224,176,48,.12);border:1px solid rgba(224,176,48,.35)}
html.ent-fx .ocE .cta{background:linear-gradient(135deg,#ee5a60,#0b46c4);box-shadow:0 0 22px rgba(224,176,48,.4),inset 0 1px 0 rgba(255,255,255,.35);letter-spacing:.03em}
html.ent-fx .ocE .cta[style*="background:var(--ok)"]{background:linear-gradient(135deg,#ee5a60,#0b46c4)!important;color:#fff}
html.ent-fx .radar{min-height:50vh;position:relative}
html.ent-fx .rd{width:240px;height:240px;filter:drop-shadow(0 0 18px rgba(224,176,48,.35))}
html.ent-fx .rd i{border:2px solid rgba(224,176,48,.7)}
html.ent-fx .rd i:nth-child(2){border-color:rgba(224,176,48,.8)}
html.ent-fx .rd::after{inset:10px;background:conic-gradient(from 0deg,transparent 0 280deg,rgba(224,176,48,.6) 360deg);box-shadow:0 0 0 1px rgba(224,176,48,.4)}

<div id="app"></div>
<script>
/*
 * Regras de cálculo do PedeAí (funções puras, sem DOM).
 * Carregado antes de app.js. Também exportado para os testes unitários em Node.
 * Valores em reais; todo arredondamento é feito para centavos.
 */
/* Modelo de valores: só três — o que o cliente paga, o valor do lojista e o valor do entregador. */

function r2(x) { return Math.round((x + Number.EPSILON) * 100) / 100; }

function validarValor(x) {
  if (typeof x !== "number" || !isFinite(x) || x < 0) throw new RangeError("valor inválido: " + x);
  return x;
}

/** Valor da taxa de entrega que vai para o entregador (a taxa inteira). */
function repasseEntregador(taxa) {
  return r2(validarValor(taxa));
}

/** Nome da origem do pedido para exibir. */
const ogNome = g => (!g || g === "APP") ? "PedeAí" : g;

/*
 * Divisão do valor de um pedido: só três valores.
 *   cliente    = o que o cliente paga (itens; mais a entrega nos produtos "com taxa de entrega")
 *   loja       = valor do lojista: itens − entrega (quando a loja paga a entrega)
 *   entregador = valor do entregador: a taxa de entrega inteira
 * Loja + entregador somam exatamente o que o cliente paga.
 */
function dividirPedido(o) {
  const total = validarValor(o.total);
  const taxa = validarValor(o.pg);
  const clientePaga = !!o.tc;  // produto com taxa: o cliente paga a entrega; senão, o lojista paga
  const loja = r2(total - (clientePaga ? 0 : taxa));
  if (loja < 0) throw new RangeError("taxa de entrega maior que o valor do pedido");
  const entregador = r2(taxa);
  const cliente = r2(total + (clientePaga ? taxa : 0));
  const soma = r2(loja + entregador);
  return { loja, entregador, total, soma, cliente };
}

/* Porcentagem de cada parte sobre o total pago pelo cliente. */
function percentuaisPedido(o) {
  const d = dividirPedido(o);
  const base = d.cliente;
  const pct = v => base ? r2((v / base) * 100) : 0;
  return { cliente: 100, loja: pct(d.loja), entregador: pct(d.entregador), base };
}

/*
 * Complementos (opções) de um produto. Cada opção é [nome, preço, id, grupo].
 * Opção sem grupo cai no grupo "Adicionais" (opcional, até 99).
 * Regras dos grupos ficam em m[7] como [nome, mínimo, máximo].
 */
const GRUPO_PADRAO = "Adicionais";
function regraGrupo(m, nome) {
  const r = ((m && m[7]) || []).find(x => x[0] === nome);
  return r ? { min: r[1], max: r[2] } : { min: 0, max: 99 };
}

/** Confere se a escolha do cliente respeita o mínimo e o máximo de cada grupo do produto. */
function validarSelecao(m, idsEscolhidos) {
  const opcoes = (m && m[5]) || [];
  const grupos = [...new Set(opcoes.map(o => o[3] || GRUPO_PADRAO))];
  for (const nome of grupos) {
    const regra = regraGrupo(m, nome);
    const n = opcoes.filter(o => (o[3] || GRUPO_PADRAO) === nome && idsEscolhidos.includes(o[2])).length;
    if (n < regra.min) return { ok: false, msg: `Escolha pelo menos ${regra.min} em "${nome}".` };
    if (n > regra.max) return { ok: false, msg: `Escolha no máximo ${regra.max} em "${nome}".` };
  }
  return { ok: true, msg: "" };
}

/** Indica se algum item do pedido é de produto com taxa de entrega. Recebe os produtos (arrays m). */
function temProdutoComTaxa(produtos) {
  return produtos.some(m => !!(m && m[6]));
}

/*
 * Extras do pedido, escolhidos na hora de pagar:
 *   talheres, maionese e catchup: grátis;
 *   refrigerante: vendido pela loja, com preço próprio, entra no subtotal e na comissão.
 */
const REFRI_MAX = 10;
function valorExtras(ex, precoRefri) {
  const q = Math.trunc((ex && ex.r) || 0);
  if (q < 0 || q > REFRI_MAX) throw new RangeError("quantidade de refrigerante inválida");
  return r2(q * validarValor(precoRefri));
}



/*
 * Status de aprovação de lojistas e entregadores, feito pela administração.
 * Registros antigos não têm o campo ap e são tratados como aprovados.
 */
function statusAprovacao(x) {
  if (x.ap === 0 && x.nome) return "pendente"; /* motoboy novo: o lojista aprova; lojas não passam por aprovação */
  if (x.ap === -1) return "suspenso";
  return "aprovado";
}

const IND_JANELA_DIAS = 730; // indicação vale por 24 meses (renovável)

/*
 * Resumo financeiro a partir dos pedidos entregues: só o valor pago pelo cliente,
 * o valor dos lojistas e o valor dos entregadores.
 * opts.desde: timestamp inicial (0 = todo o período).
 */
function resumoFinanceiro(pedidos, opts) {
  const desde = (opts && opts.desde) || 0;
  const linhas = [];
  for (const o of pedidos) {
    if (o.st !== "entregue") continue;
    const dt = o.dt || 0;
    if (desde && dt < desde) continue;
    const div = dividirPedido(o);
    linhas.push({
      id: o.id, dt, loja: o.rn || "", origem: ogNome(o.og),
      cliente: div.cliente, valorLoja: div.loja, valorEntregador: div.entregador,
    });
  }
  const soma = k => r2(linhas.reduce((t, l) => t + l[k], 0));
  const totais = {
    pedidos: linhas.length,
    cliente: soma("cliente"),
    loja: soma("valorLoja"),
    entregador: soma("valorEntregador"),
  };
  return { linhas, totais };
}


/* Convite do motoboy: só pelo link #convite=m-<idLoja>, gerado pelo lojista. Nenhum outro convite existe. */

function conviteToken(tipo, id) { return tipo === "entregador" ? "m-" + id : null; }

/** Lê o hash da URL. Retorna { tipo, loja } (loja = id do lojista que convidou) ou null. */
function parseConvite(hash) {
  const m = /^#convite=m-([A-Za-z0-9]+)$/.exec(hash || "");
  return m ? { tipo: "entregador", loja: m[1] } : null;
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    r2, repasseEntregador, ogNome,
    dividirPedido, percentuaisPedido, valorExtras, REFRI_MAX, regraGrupo, validarSelecao, temProdutoComTaxa, GRUPO_PADRAO,
    statusAprovacao, resumoFinanceiro, IND_JANELA_DIAS,
    conviteToken, parseConvite,
  };
}

</script>

/*
 * Instalação do PedeAí no celular (PWA).
 * Android/Chrome: botão que dispara o aviso nativo de instalação.
 * iPhone/Safari: instruções de "Adicionar à Tela de Início" (o Safari não tem aviso de instalação).
 * Carregado antes de app.js. Usa draw() e toast() de app.js em tempo de execução.
 */
let INSTALL_EVENT = null;
/* Um único APK: PedeAi.apk (pasta downloads/). Ele já traz todos os perfis; o perfil vem do link (ADM -> lojista -> cliente/motoboy). */
const apkHref = () => "downloads/PedeAi.apk";
/* Verifica se o APK existe em downloads/ (uma vez). Sem ele, o botão mostra a instalação pelo navegador. */
window.__APKS = {};
(location.protocol.startsWith("http")
  ? fetch(apkHref(), { method: "HEAD", cache: "no-store" }).then(r => { window.__APKS.App = r.ok; }).catch(() => { window.__APKS.App = false; })
  : Promise.resolve(window.__APKS.App = false)
).then(() => { if (typeof S !== "undefined" && typeof draw === "function") draw(); });

const ehInstalado = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const ehIPhone = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
const ehArquivoLocal = () => location.protocol === "file:";

/* Redesenha quando o navegador libera/encerra a instalação; no lojista só se não estiver digitando. */
const redesenhaInstalar = () => {
  if (typeof S === "undefined") return;
  const t = ((document.activeElement || {}).tagName || "");
  if (!S.role || (S.role === "lojista" && !/^(INPUT|TEXTAREA|SELECT)$/.test(t))) draw();
};
addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  INSTALL_EVENT = e;
  redesenhaInstalar();
});

addEventListener("appinstalled", () => {
  INSTALL_EVENT = null;
  redesenhaInstalar();
});

/** Botão de instalação direta (igual ao BEMDI): aparece quando o navegador pode instalar ou no iPhone. */
function botaoInstalar() {
  if (ehInstalado() || ehArquivoLocal()) return "";
  if (!INSTALL_EVENT && !ehIPhone()) return "";
  return `<button id="inst" class="cta" data-install style="justify-content:center;margin:10px 0 0">📲 Baixar e Instalar App</button>`;
}

/** Bloco "Baixar e instalar": botão de verdade (APK) em todas as telas de loja e cliente. */
function blocoInstalar() { return ""; }

/** Bloco da tela inicial com o botão de instalação. */
function pwaHTMLOrig() { return ""; }


/* Se o APK ainda não estiver publicado, o botão instala pelo navegador. */
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href*="downloads/PedeAi.apk"]');
  if (!a) return;
  if (window.__APKS && window.__APKS.App === true) return;
  e.preventDefault();
  if (INSTALL_EVENT) {
    const ev = INSTALL_EVENT;
    ev.prompt();
    ev.userChoice.then(res => { INSTALL_EVENT = null; if (res && res.outcome === "accepted") toast("App instalado. Procure o ícone do PedeAí na tela inicial."); draw(); });
  } else {
    alert('Para instalar: toque nos três pontinhos do Chrome e depois em "Instalar app" (ou "Adicionar à tela inicial").');
  }
}, true);

document.addEventListener("click", e => {
  const t = e.target.closest && e.target.closest("[data-install]");
  if (!t) return;
  if (!INSTALL_EVENT) {
    alert('No iPhone: toque em Compartilhar (quadrado com seta) e depois em "Adicionar à Tela de Início".');

  }
  const ev = INSTALL_EVENT;

    INSTALL_EVENT = null;
    if (res && res.outcome === "accepted") toast("App instalado. Procure o ícone PedeAí Brasil na tela inicial.");

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

let PROCESSANDO = 0;

const lojaLinkId = () => { const m = /^#cardapio-(\w+)/.exec(location.hash); if (m) return m[1]; try { return localStorage.getItem("pedeai-loja") || null; } catch (e) { return null; } };

    if (rua.length < 3 || bairro.length < 2 || cid.length < 2) return toast("Informe rua e número, bairro e cidade.");
    if (cnh.length < 9) return toast("Informe o número da CNH.");
    if (!(__ft.selfie && __ft.cnh && __ft.veiculo)) return toast("Envie as 3 fotos: selfie, CNH e veículo.");
    const lj = R.find(x => String(x.id) == String(CONVITE.loja));
    const reg = { id: ME, nome, tel, em: email, cep, ea: rua, eb: bairro, ecid: cid, veic: v("cv"), placa: v("cp").trim().toUpperCase(), cnh, ftSelfie: __ft.selfie, ftCnh: __ft.cnh, ftVeiculo: __ft.veiculo, lojaConvite: String(CONVITE.loja), lojaDono: (lj && lj.dono) || "", ts: Date.now(), ap: 0 };
    put("ent/" + ME, reg).then(ok => { if (ok) { window.__ft = {}; aceitarConvite("entregador", "Candidatura enviada. Aguarde a aprovação da loja."); } });
    return;
  }
}

/** Bloco de um link com os termos do tipo escolhido. */
function linkBloco(link, tipo) {
  const t = TERMOS[tipo];
  return `<div class="oc"><div class="meta">Link para indicar ${tipo == "lojistaPorEntregador" ? "uma loja" : t.titulo.toLowerCase()}</div><b style="font-size:14.5px;word-break:break-all">${E(linkConvite(link))}</b><div class="meta" style="margin-top:6px">${t.texto}</div><div class="row" style="gap:8px"><button class="cta" data-share style="flex:1;justify-content:center;margin-top:8px;background:var(--bg);color:var(--ac);border:1px solid var(--ac)">Compartilhar</button></div><button data-indtipo="" style="margin-top:8px;color:var(--ac);font-weight:800">‹ Trocar tipo de indicação</button></div>`;
}

function opcaoIndicacao(tipo, termo) {
  const t = TERMOS[termo || tipo];
  return `<button class="card" data-indtipo="${tipo}" style="margin:0 0 10px;width:100%;flex-direction:column;align-items:flex-start;gap:4px"><b>${t.titulo}</b><div class="meta">${t.texto}</div></button>`;
}

/** Painel de indicações (sheet "ind"). Entregador escolhe o tipo antes de ver o link. */
function indSheetHTML() {
  const I = indInfo();
  const refs = refsMeus();
  const meus = S.IND.filter(x => refs.includes(x.ref));
  const rotulo = { pendente: "Em análise", ativa: "Ativa", recusada: "Recusada", suspensa: "Suspensa" };
  const linha = x => {
    const nome = x.tipo == "lojista" ? ((R.find(y => String(y.id) == String(x.alvo)) || {}).n || "Loja") : ((S.EN.find(e => e.id == x.alvo) || {}).nome || "Entregador");
    return `<div class="line"><span>${E(nome)}<br><small class="meta">${x.tipo == "lojista" ? "Lojista" : "Entregador"} · ${rotulo[x.st || "ativa"] || ""}</small></span></div>`;
  };
  let bloco;
  if (S.role !== "entregador") {
    bloco = `<div class="oc"><b>Indicações são feitas só por entregadores</b><div class="meta">Lojistas e clientes não indicam. Quem quer indicar uma loja pede o link a um entregador aprovado.</div></div>`;
  } else if (!S.indTipo) {
    bloco = `<b>Quem você quer indicar?</b><div class="meta" style="margin:4px 0 10px">Cada tipo tem o seu próprio link.</div>${opcaoIndicacao("lojista", "lojistaPorEntregador")}${opcaoIndicacao("entregador")}`;
  } else {
    bloco = linkAtual()
      ? linkBloco(linkAtual(), S.indTipo == "lojista" ? "lojistaPorEntregador" : S.indTipo)
      : `<div class="oc"><b>Em breve</b><div class="meta">As indicações ainda não estão disponíveis.</div><button data-indtipo="" style="margin-top:8px;color:var(--ac);font-weight:800">‹ Voltar</button></div>`;
  }
  return `<div class="sheet"><div class="panel" style="max-height:88%;overflow:auto"><b style="font-size:18px">🤝 Indicações</b><div class="meta" style="margin:4px 0 10px">${S.role == "lojista" ? "Convide lojistas com seu link." : "Indique lojistas ou entregadores."}</div>${bloco}<b>Indicados (${meus.length})</b>${meus.length ? meus.map(linha).join("") : '<div class="meta">Nenhum indicado ainda.</div>'}<div class="oc" style="margin-top:12px"><b>💡 Como funciona</b><div class="meta">O candidato cadastra pelo link. Entregador candidato: você confirma o apadrinhamento e os entregadores votam. A indicação fica ativa só depois da aprovação.</div></div><button class="cta" data-close2 style="justify-content:center;margin-top:10px;background:var(--bg);color:var(--tx);border:1px solid var(--br)">Fechar</button></div></div>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest && e.target.closest("[data-convite],[data-convite-sair],[data-share],[data-indtipo]");
  if (!t) return;
  if (t.hasAttribute("data-convite")) return enviarConvite();
  if (t.hasAttribute("data-convite-sair")) { CONVITE = null; try { localStorage.removeItem("pedeai-convite"); } catch (e) {} history.replaceState(null, "", location.pathname + location.search); return draw(); }
  if (t.hasAttribute("data-indtipo")) { S.indTipo = t.dataset.indtipo || null; return draw(); }
  if (t.hasAttribute("data-share")) { const link = linkAtual() && linkConvite(linkAtual()); if (!link) return toast("Escolha o tipo de indicação primeiro."); return compartilhar(link, "Entre no PedeAí pelo meu convite:"); }
});

<script>
/*
 * Painel da administração (quarto perfil). Usa o estado de app.js (S, R, O, EN, IND, save, toast, draw).
 * Carregado antes de app.js; as funções só são chamadas depois que app.js termina de carregar.
 */
const CT = { tab: "painel", st: "todos", per: "tudo" };
const COOP_TABS = [["painel", "Painel"], ["eq", "Acessos"], ["par", "Corridas paradas"], ["pedidos", "Pedidos"], ["fin", "Financeiro"], ["lj", "Lojas"], ["cad", "Cadastro"], ["pix", "Pix"], ["backup", "Backup"]];
const ATIVO = ["novo", "preparo", "pronto", "aceito", "rota"];
const DIA_MS = 864e5;

const inicioHoje = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const periodoDesde = p => p == "hoje" ? inicioHoje() : p == "30d" ? Date.now() - 30 * DIA_MS : 0;
const normFin = o => Object.assign({}, o, { pg: o.pg || PG });

function indicadosAtivos() {
  const agora = Date.now(), s = { lojistas: new Map(), entregadores: new Set() };
  S.IND.forEach(x => {
    if (x.st != "pendente" && x.st != "recusada" && x.st != "suspensa" && agora < x.ts + IND_JANELA_DIAS * DIA_MS) if (x.tipo == "lojista") s.lojistas.set(x.alvo, x.regra || "comissao_5"); else s.entregadores.add(x.alvo);
  });
  return s;
}

function pendentes() {
  return R.filter(x => statusAprovacao(x) == "pendente").length;
}

/** Aviso mostrado a lojistas e entregadores que ainda não estão aprovados. */
function statusBanner(x, tipo) {
  const s = statusAprovacao(x);
  if (s == "aprovado") return "";
  const txt = s == "pendente"
    ? (tipo == "loja" ? "Sua loja está aguardando aprovação da administração. Ela só aparece para clientes depois de aprovada."
                      : "Seu cadastro está em análise pela administração. Você poderá receber entregas depois da aprovação.")
    : (tipo == "loja" ? "Esta loja está suspensa pela administração." : "Seu cadastro está suspenso pela administração. Procure a administração para regularizar.");
  return `<div class="oc" style="border-color:var(--yl)"><b>${s == "pendente" ? "Em análise" : "Suspenso"}</b><div class="meta">${txt}</div></div>`;
}

function coopHTML() {
  const n = pendentes();
  const tabs = COOP_TABS.map(([k, l]) => `<button class="${CT.tab == k ? "on" : ""}" data-coop="tab" data-v="${k}">${l}${k == "par" && paradasN() ? ` (${paradasN()})` : ""}</button>`).join("");
  const corpo = avisosPlano("adm",R) + { painel: coopPainel, aprov: coopAprov, par: coopParadas, pedidos: coopPedidos, fin: coopFin, pix: coopPix, eq: coopEquipe, lj: coopLojas, cad: coopCad, backup: coopBackup }[CT.tab]();
  return `<div class="roles"><span style="flex:1;display:flex;align-items:center;gap:8px;padding:12px 16px;font-weight:800;font-size:16px;color:var(--ac)">${ic("all", 24)}Administração${quemSou()}</span><button data-admout style="flex:none;padding:12px 10px;font-size:14.5px">Sair</button><button data-switch style="flex:none;padding:12px 16px;font-size:14.5px">Trocar perfil</button></div><div class="pg"><div class="tabs">${tabs}</div>${corpo}<div class="meta" style="text-align:center;margin-top:18px">PedeAí · versão 82</div></div>`;
}

function tile(n, l) {
  return `<div class="oc" style="flex:1 1 140px;margin:0"><b style="font-size:20px">${n}</b><div class="meta">${l}</div></div>`;
}

/* ===== Aba Criador: números de uso, só para o criador do sistema ===== */
function metricaSalva(){
  if(!DB||!ME)return;
  const n=(k)=>{try{return parseInt(localStorage.getItem(k),10)||0}catch(e){return 0}};
  if(!window.__metSess){window.__metSess=1;try{localStorage.setItem("pedeai-visitas",String(n("pedeai-visitas")+1));if(!localStorage.getItem("pedeai-primeiro"))localStorage.setItem("pedeai-primeiro",String(Date.now()))}catch(e){}}
  const prod=R.filter(x=>x.dono==ME).reduce((t,x)=>t+(x.m||[]).length,0);
  const ped=(S.O||[]).filter(o=>o.cid==ME||o.ld==ME||o.en==ME).length;
  const cad=!!(cliCad()||(S.EN||[]).find(e=>e.id==ME)||R.some(x=>x.dono==ME));
  const pap=S.role||"";
  const campos={papel:pap,visitas:n("pedeai-visitas")||1,cadastro:cad,produtos:prod,pedidos:ped};
  /* Lojista/gerente: produtos novos x editados, meta de 15 vendas por dia e pedidos do link x avulsos */
  const minhas=R.filter(x=>x.dono==ME);
  if(minhas.length){
    try{
      let st;try{st=JSON.parse(localStorage.getItem("pedeai-met-prod"))}catch(e){}
      const sig={};minhas.forEach(x=>(x.m||[]).forEach((p,k)=>{sig[pid(p,k)]=JSON.stringify(p)}));
      if(!st||!st.sig)st={sig:sig,novos:Object.keys(sig).length,edic:0};
      else{Object.keys(sig).forEach(i=>{if(!(i in st.sig))st.novos++;else if(st.sig[i]!==sig[i])st.edic++});st.sig=sig}
      try{localStorage.setItem("pedeai-met-prod",JSON.stringify(st))}catch(e){}
      campos.prodNovos=st.novos;campos.prodEdicoes=st.edic;
    }catch(e){}
    const meus=(S.O||[]).filter(o=>o.ld==ME&&o.st!="cancelado");
    const dia=t=>{const d=new Date(t||0);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
    const porDia={};meus.forEach(o=>{const k=dia(o.ct);porDia[k]=(porDia[k]||0)+1});
    campos.diaRef=dia(Date.now());campos.vendasHoje=porDia[campos.diaRef]||0;
    campos.diasMeta=Object.keys(porDia).filter(k=>porDia[k]>=15).length;
    campos.pedLink=meus.filter(o=>!o.man).length;campos.pedAvulso=meus.filter(o=>o.man).length;
  }
  const chave=JSON.stringify(campos);
  if(window.__metLast===chave)return;
  window.__metLast=chave;
  DB.doc("metricas/"+ME).set(Object.assign({id:ME,primeiro:n("pedeai-primeiro")||Date.now(),ultimo:Date.now()},campos)).catch(()=>{});
}
function coopPainel() {
  const h = inicioHoje();
  const pedHoje = S.O.filter(o => (o.ct || 0) >= h).length;
  const entHoje = S.O.filter(o => o.st == "entregue" && (o.dt || 0) >= h);
  const emAndamento = S.O.filter(o => ATIVO.includes(o.st)).length;
  const receitaHoje = resumoFinanceiro(entHoje.map(normFin), { desde: h }).totais.cliente;
  const lojasAtivas = R.filter(x => statusAprovacao(x) == "aprovado").length;
  const entAtivos = S.EN.filter(e => statusAprovacao(e) == "aprovado").length;
  return `<h2 style="margin:6px 0">Hoje</h2><div style="display:flex;flex-wrap:wrap;gap:10px">${tile(pedHoje, "pedidos criados")}${tile(entHoje.length, "entregues")}${tile(emAndamento, "em andamento")}${tile(M(receitaHoje), "pago pelos clientes hoje")}${tile(lojasAtivas, "lojistas aprovados")}${tile(entAtivos, "entregadores aprovados")}</div><div class="oc" style="margin-top:10px;border-color:${sysTravado() ? "var(--rd)" : "var(--br)"}"><b>Limite diário do sistema</b><div class="meta" style="margin:4px 0 8px">${sysCiclo()} de ${limiteHoje()} pedidos hoje${sysTravado() ? " · 🔒 LIMITE ATINGIDO (novos pedidos bloqueados)" : ""}. Renova sozinho amanhã.</div></div><div class="oc" style="margin-top:10px"><b>Link do lojista</b><div class="meta">Envie ao lojista para ele entrar no app.</div><button class="cta" data-coop="linkloj" style="justify-content:center;margin-top:8px">Compartilhar link do lojista</button></div>${pendentes() ? `<div class="oc" style="margin-top:12px;border-color:var(--yl)"><b>${pendentes()} cadastro(s) aguardando aprovação</b><div class="meta">Veja na aba Aprovações.</div></div>` : ""}`;
}

function linhaAprov(tipo, x, titulo, sub, extra) {
  const s = statusAprovacao(x);
  const etapaTxt = null;
  const badge = etapaTxt && s == "pendente" ? etapaTxt : { pendente: "Em análise", aprovado: "Aprovado", suspenso: "Suspenso" }[s];
  const acoes = s == "pendente"
    ? `<button class="cta" data-coop="ap" data-tipo="${tipo}" data-id="${E(x.id)}" data-v="1" style="justify-content:center;flex:1">Aprovar</button><button class="cta" data-coop="ap" data-tipo="${tipo}" data-id="${E(x.id)}" data-v="-1" style="justify-content:center;flex:1;background:var(--bg);color:var(--rd);border:1px solid var(--rd)">Recusar</button>`
    : s == "aprovado"
      ? `<button class="cta" data-coop="ap" data-tipo="${tipo}" data-id="${E(x.id)}" data-v="-1" style="justify-content:center;background:var(--bg);color:var(--rd);border:1px solid var(--rd)">Suspender</button>`
      : `<button class="cta" data-coop="ap" data-tipo="${tipo}" data-id="${E(x.id)}" data-v="1" style="justify-content:center">Reativar</button>`;
  return `<div class="oc"><div class="row"><b>${E(titulo)}</b><span class="tag">${badge}</span></div><div class="meta">${sub}</div><div class="row" style="gap:8px;margin-top:8px">${acoes}${extra || ""}</div></div>`;
}

function coopAprov() {
  const lojas = R.map(x => linhaAprov("lojista", x, x.n, `${E(x.c || "")} · ${E(x.ad || "endereço não informado")}${x.bo ? " · " + E(x.bo) : ""}`)).join("");
  return `<h2 style="margin:6px 0">Lojistas</h2>${lojas || '<div class="empty">Nenhum lojista cadastrado.</div>'}`;
}

function coopPedidos() {
  const filtros = { todos: () => true, ativos: o => ATIVO.includes(o.st), entregue: o => o.st == "entregue", cancelado: o => o.st == "cancelado" };
  const lista = S.O.filter(filtros[CT.st] || filtros.todos).slice().reverse();
  const opts = [["todos", "Todos"], ["ativos", "Em andamento"], ["entregue", "Entregues"], ["cancelado", "Cancelados"]]
    .map(([v, l]) => `<option value="${v}" ${CT.st == v ? "selected" : ""}>${l}</option>`).join("");
  const rows = lista.slice(0, 100).map(o => {
    const en = S.EN.find(e => e.id == o.en);
    const podeCancelar = o.st != "entregue" && o.st != "cancelado";
    return `<div class="oc"><div class="row"><b>#${o.id} · ${E(o.rn || "")}</b><span class="tag">${LB[o.st] || o.st}</span></div><div class="meta">${M(o.total)} · ${E(ogNome(o.og))}${o.man ? " (externo)" : ""} · Entregador: ${en ? E(en.nome) : "—"}</div>${podeCancelar ? `<button class="cta" data-coop="cancel" data-id="${o.id}" style="justify-content:center;margin-top:8px;background:var(--bg);color:var(--rd);border:1px solid var(--rd)">Cancelar pedido</button>` : ""}</div>`;
  }).join("");
  return `<div class="pg" style="padding:8px 0 0"><select id="cf-st">${opts}</select></div>${rows || '<div class="empty">Nenhum pedido neste filtro.</div>'}${lista.length > 100 ? `<div class="meta" style="padding:8px 16px">Mostrando 100 de ${lista.length}.</div>` : ""}`;
}

/** Divisão de um pedido em uma linha: cliente, lojista e entregador. */
function divisaoTexto(o) {
  const d = dividirPedido(normFin(o));
  return `Cliente paga ${M(d.cliente)} · Lojista ${M(d.loja)} · Entregador ${M(d.entregador)}`;
}

/** Bloco explicativo com os três valores e um exemplo real de cálculo. */
function blocoDivisao() {
  const ex = dividirPedido({ total: 49.9, pg: 9, man: 0 });
  const pc = percentuaisPedido({ total: 49.9, pg: 9, man: 0 });
  const pct = v => v.toFixed(2).replace(".", ",") + "%";
  const linha = (nome, valor, p, ob) => `<div class="line"><span>${nome}<br><small class="meta">${ob}</small></span><span style="text-align:right"><b>${M(valor)}</b><br><small class="meta">${pct(p)}</small></span></div>`;
  return `<div class="oc" style="margin-top:10px"><b>Os três valores</b><div class="meta" style="margin:4px 0 6px">Exemplo: pedido de R$ 49,90 com entrega de R$ 9. Porcentagem sobre o total pago pelo cliente.</div>${linha("Cliente paga", ex.cliente, pc.cliente, "itens do pedido (mais a entrega, nos produtos com taxa de entrega)")}${linha("Lojista", ex.loja, pc.loja, "itens − entrega, quando a loja paga a entrega")}${linha("Entregador", ex.entregador, pc.entregador, "taxa de entrega inteira")}</div>`;
}

function coopFin() {
  const r = resumoFinanceiro(S.O.map(normFin), { desde: periodoDesde(CT.per) });
  const t = r.totais;
  const per = [["tudo", "Todo o período"], ["hoje", "Hoje"], ["30d", "Últimos 30 dias"]]
    .map(([v, l]) => `<option value="${v}" ${CT.per == v ? "selected" : ""}>${l}</option>`).join("");
  const linhas = r.linhas.slice().reverse().slice(0, 50).map(l =>
    `<div class="line"><span>#${l.id} · ${E(l.loja)}<br><small class="meta">${l.dt ? new Date(l.dt).toLocaleDateString("pt-BR") : "—"} · ${E(l.origem)}</small></span><span style="text-align:right">${M(l.cliente)}<br><small class="meta">lojista ${M(l.valorLoja)} · entregador ${M(l.valorEntregador)}</small></span></div>`
  ).join("");
  return `<div class="pg" style="padding:8px 0 0"><select id="cf-per">${per}</select></div>${blocoDivisao()}
<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px">${tile(t.pedidos, "pedidos entregues")}${tile(M(t.cliente), "pago pelos clientes")}${tile(M(t.loja), "valor dos lojistas")}${tile(M(t.entregador), "valor dos entregadores")}</div>
<button class="cta" data-coop="csv" style="justify-content:center;margin-top:10px">Exportar CSV</button>
<h2 style="margin:14px 0 6px">Pedidos entregues</h2>${linhas || '<div class="empty">Nenhum pedido entregue neste período.</div>'}`;
}

function csvFinanceiro(linhas) {
  const cab = ["pedido", "data", "loja", "origem", "cliente_paga", "valor_lojista", "valor_entregador"];
  const num = v => v.toFixed(2).replace(".", ",");
  const txt = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = linhas.map(l => [
    l.id, l.dt ? new Date(l.dt).toLocaleString("pt-BR") : "", txt(l.loja), txt(l.origem),
    num(l.cliente), num(l.valorLoja), num(l.valorEntregador),
  ].join(";"));
  return "\ufeff" + [cab.join(";"), ...rows].join("\r\n");
}

function baixar(nome, conteudo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = nome; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.addEventListener("click", e => {
  if (S.role != "cooperativa") return;
  const t = e.target.closest && e.target.closest("[data-coop]");
  if (!t) return;
  const acao = t.dataset.coop, v = t.dataset.v, id = t.dataset.id;
  if (acao == "tab") { CT.tab = v; return draw(); }
  if (acao == "linkloj") { const l = (cardBase() || window.PEDEAI_URL || "https://meudelivery-six.vercel.app/").replace(/#.*$/, "") + "#lojista"; return compartilhar(l, "Entre no PedeAí como lojista:"); }
  if (acao == "ap") {
    const tipo = t.dataset.tipo == "lojista" ? "lojista" : "entregador";
    const reg = tipo == "entregador" ? S.EN.find(x => x.id == id) : R.find(x => String(x.id) == String(id));
    const msg = +v == 1 ? "Cadastro aprovado." : "Cadastro suspenso.";
    save((tipo == "lojista" ? "lojas/" : "ent/") + id, { ap: +v }).then(ok => { if (ok) toast(msg); });
    return;
  }
  if (acao == "lib") {
    const e = S.EN.find(x => x.id == id);
    if (!e) return;
    save("ent/" + id, { ba: entDoDia(e.id), bd: hojeISO() }).then(ok => { if (ok) toast(E(e.nome) + " liberado para mais " + ENT_LIMITE + " entregas."); });
    return;
  }
  if (acao == "cancel") {
    const o = S.O.find(y => y.id == id);
    if (!o || o.st == "entregue" || o.st == "cancelado") return toast("Este pedido não pode ser cancelado.");
    if (!confirm("Cancelar o pedido #" + id + "?")) return;
    save("pedidos/" + id, { st: "cancelado", cn: Date.now() }).then(ok => { if (ok) toast("Pedido cancelado pela administração."); });
    return;
  }
  if (acao == "csv") {
    const r = resumoFinanceiro(S.O.map(normFin), { desde: periodoDesde(CT.per), indicados: indicadosAtivos() });

/* Rastreio: trajeto Loja → Cliente, 🛵 em movimento e tempo estimado (+3 a 4 min de folga) */
const hav=(a,b)=>{const r=Math.PI/180,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r,h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dg/2)**2;return 12742*Math.asin(Math.sqrt(h))};

/* ===== BACKUP DA LOJA: exportar / restaurar (só a própria loja, criptografado) ===== */
const BK_FMT="pedeai-backup",BK_V=1,BK_PROT=["id","dono","ap","pg","rp","bkl"];
const bkB64=u=>{let s="";const a=new Uint8Array(u);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)};
const bkUn=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const bkVal=id=>(document.getElementById(id)||{}).value||"";

async function bkKey(pass,salt,it){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:it,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}

const bkIdb=()=>new Promise((ok,no)=>{const q=indexedDB.open("pedeai-bkp",1);q.onupgradeneeded=()=>{q.result.createObjectStore("k");q.result.createObjectStore("s",{keyPath:"id"})};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
