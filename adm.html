<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADM (Setor 2) · PedeAí Brasil</title>
<style>
:root{--bg:#0b0b0d;--cd:#16161a;--br:#2a2a31;--tx:#f4f4f6;--mu:#a3a3ad;--ac:#d4141c;--gd:#c99700;--ok:#22a559;--rd:#ff4d55;--yl:#e0a800;--bl:#2f6fed}
@media(prefers-color-scheme:light){:root{--bg:#f6f6f8;--cd:#fff;--br:#dcdce3;--tx:#15151a;--mu:#5d5d68}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,sans-serif;padding-bottom:40px}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px;font-weight:800;color:var(--ac);border-bottom:1px solid var(--br)}
.pv{background:var(--gd);color:#000;font-size:13.5px;font-weight:800;padding:6px 12px;text-align:center}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px}.tabs button{flex:none;border:1px solid var(--br);background:var(--cd);color:var(--tx);padding:10px 14px;border-radius:999px;font:inherit;font-weight:700}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pg{padding:4px 14px;max-width:720px;margin:0 auto}h2{margin:10px 0 6px;font-size:18px}
.oc{background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:12px;margin:10px 0}.oc.al{border-color:var(--rd)}
.meta{color:var(--mu);font-size:15.5px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{font-size:13.5px;font-weight:800;border:1px solid var(--br);border-radius:999px;padding:2px 9px}
.grid{display:flex;flex-wrap:wrap;gap:10px}.tile{flex:1;min-width:120px;background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:12px}.tile b{font-size:24px;display:block}
button.cta,.cta{display:flex;justify-content:center;width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:800}
.cta.o{background:transparent;color:var(--rd);border:1px solid var(--rd)}.cta.b{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.card{display:flex;width:100%;text-align:left;gap:8px;align-items:center;background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:12px;margin:8px 0;color:var(--tx);font:inherit}
input,select{width:100%;margin-top:6px;padding:11px;border-radius:10px;border:1px solid var(--br);background:var(--bg);color:var(--tx);font:inherit}
.back{border:1px solid var(--br);background:var(--cd);color:var(--tx);padding:8px 14px;border-radius:10px;font:inherit;margin:6px 0}
summary{font-weight:800;cursor:pointer;font-size:17px}.sw{border-color:var(--yl)}
table{width:100%;border-collapse:collapse;font-size:15.5px}td,th{padding:6px 4px;border-bottom:1px solid var(--br);text-align:left}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;display:none;z-index:9}
</style><link rel="manifest" href="manifest-adm.json"><meta name="theme-color" content="#2b6cb0"><link rel="icon" href="icon-adm-192.png"><link rel="apple-touch-icon" href="icon-adm-192.png"><meta name="apple-mobile-web-app-capable" content="yes"></head><body>
<div class="pv" id="pa-st" style="background:#111;color:#e0a800;font-size:12.5px;font-weight:700">○ Conectando…</div>
<div class="pg" id="inst"></div>
<div class="top" id="topn">Administração</div>
<div class="tabs" id="tabs"></div><div class="pg" id="v"></div><div class="toast" id="t"></div>
<script>
const PLN={mensal:"Mensal",anual:"Anual",pers:"Personalizado"};
let L=[],MYCODE=null,LOADED=false,LERR=null;const MYS=new Set(),IDS={};let SEQ=0;
const nid=s=>IDS[s]||(IDS[s]=++SEQ);
const nmS=s=>{const x=L.find(y=>y.slug==s);return x?x.n:s};
const OCm=()=>OCO.filter(o=>MYS.has(o.lj));
const ACC=[];
let bk=false,fc=false;
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function som(k){try{const c=new(window.AudioContext||window.webkitAudioContext)(),seq=k=="plim"?[[1318,0],[1568,.16]]:[[440,0],[330,.22],[440,.44]];seq.forEach(([fr,t])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=fr;o.type=k=="plim"?"sine":"square";g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.14)})}catch(e){}}
const fd=ms=>iso(new Date(ms)).split("-").reverse().join("/");
async function salvaPlano(id){const x=L.find(y=>y.id==id),v=$("pv"+id).value;if(!v||!x||!x.conta){toast("Plano ainda carregando");return}
 const cur=PA_estado(x.conta,Date.now()).v,base=x.conta.vencBase||cur,alt=x.conta.admAlt||0;
 const dias=Math.round((new Date(v+"T00:00:00")-new Date(iso(new Date(cur))+"T00:00:00"))/864e5);
 if(!dias){toast("Plano salvo");return}
 if(alt>=2){toast("Já usou as 2 alterações: só falando com o Criador");return}
 const novo=cur+dias*864e5,lim=base+5*864e5;
 if(novo>lim){toast("Passa de 35 dias da entrada. Máximo: "+fd(lim));return}
 if(novo<Date.now()){toast("Escolha uma data de hoje em diante");return}
 try{await PA.setVencLoja(x.dono,{venc:novo,admAlt:alt+1,vencBase:base});toast("Vencimento salvo ("+(alt+1)+" de 2 alterações usadas)")}
 catch(e){console.error(e);toast("Não foi possível salvar ("+(e.code||"erro")+")")}}
async function susp(id){const x=L.find(y=>y.id==id);if(!x)return;
 try{await PA.setSusp(x.slug,!x.sus);toast(x.sus?"Loja reativada":"Loja suspensa")}catch(e){console.error(e);toast("Não foi possível alterar ("+(e.code||"erro")+")")}}
let tab="painel",open=null,ENT={km:1.5,min:6,vel:25,esp:5,raio:10};const $=i=>document.getElementById(i);
const R$=n=>"R$ "+n.toLocaleString("pt-BR",{minimumFractionDigits:2});
const entOn=x=>x.ent!==false&&x.tp!=="agenda";
const HOJE=new Date("2026-10-27T00:00:00");
/* estadoPlano: 🟢 Ativa · 🟡 A vencer (até 7 dias) · 🟠 Carência (até 3 dias após vencer) · 🔴 Travada (depois da carência) */
function estadoPlano(x){if(!x.conta&&x.pend)return{k:"pendente",ico:"⏳",cor:"var(--mu)",lbl:"Aguardando o gerente abrir o link"};if(!x.conta)return{k:"carregando",ico:"⏳",cor:"var(--mu)",lbl:"Carregando plano…"};
 const e=PA_estado(x.conta,Date.now()),cor={ativa:"var(--ok)",avencer:"var(--yl)",carencia:"#ff8a3d",travada:"var(--rd)"}[e.k];
 return{k:e.k,ico:e.ico,cor,lbl:e.t}}
const bdg=x=>{const e=estadoPlano(x);return `<span class="tag" style="border-color:${e.cor};color:${e.cor}">${e.ico} ${e.lbl}</span>`};
const toast=m=>{const t=$("t");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2200)};
const nm=v=>parseFloat(String(v).replace(",","."))||0;
let ENTG=false;
const ganhoKm=(d,E)=>Math.max(E.min,d*E.km);
const tempoMin=(d1,d2,E)=>Math.round(d1/E.vel*60+E.esp+d2/E.vel*60);
function sim(){const d1=nm($("s1").value),d2=nm($("s2").value),E={km:nm($("ekm").value)||ENT.km,min:nm($("emin").value)||ENT.min,vel:nm($("evel").value)||ENT.vel,esp:nm($("eesp").value)};
 $("sr").innerHTML=`<b style="font-size:20px">${R$(ganhoKm(d2,E))}</b> de ganho · ${d2.toFixed(1).replace(".",",")} km de entrega<div class="meta">⏱️ ~${tempoMin(d1,d2,E)} min no total: ${Math.round(d1/E.vel*60)} min até a loja + ${E.esp} min na loja + ${Math.round(d2/E.vel*60)} min até o cliente</div>`}
function salvaEnt(){const k=nm($("ekm").value),m=nm($("emin").value),v=nm($("evel").value);if(k<=0||v<=0){toast("Informe o valor por km e a velocidade média");return}const rm=nm($("erm").value);if(rm<=0){toast("Informe o raio máximo global (km)");return}ENT={km:k,min:m,vel:v,esp:Math.max(0,nm($("eesp").value)),raio:rm};draw();toast("Regra salva: "+R$(k)+" por km · raio máximo "+String(rm).replace(".",",")+" km")}
const TABS=[["painel","Painel"],["lj","Lojas"],["pix","💠 Pix"],["msg","📨 Mensagens"],["oc","⚠️ Ocorrências"],["eq","Acessos"],["fin","Financeiro"],["cfg","Config"]];
const cnt=k=>k=="eq"?((window.PA&&PA.rhN)||0):k=="pix"?PIX.filter(p=>p.st=="pend").length:k=="msg"?MSG.filter(m=>!m.lida&&!m.resp).length:k=="oc"?OCm().filter(o=>o.st=="aberta").length:0;
const tile=(n,l)=>`<div class="tile"><b>${n}</b><span class="meta">${l}</span></div>`;
function painel(){const H=L.reduce((a,x)=>({cri:a.cri+x.h.cri,ent:a.ent+x.h.ent,and:a.and+x.h.and,pago:a.pago+x.h.pago}),{cri:0,ent:0,and:0,pago:0});const C={ativa:0,avencer:0,carencia:0,travada:0};L.forEach(x=>{const k=estadoPlano(x).k;if(k in C)C[k]++});return `<h2>Hoje</h2><div class="grid">${tile(H.cri,"pedidos criados")}${tile(H.ent,"entregues")}${tile(H.and,"em andamento")}${tile(R$(H.pago),"pago pelos clientes hoje")}</div>
<h2 style="margin-top:16px">📄 Planos das lojas</h2><div class="grid">${tile(C.ativa,"🟢 Ativa")}${tile(C.avencer,"🟡 A vencer")}${tile(C.carencia,"🟠 Carência")}${tile(C.travada,"🔴 Travada")}</div>
<h2 style="margin-top:16px">🚨 Alertas</h2>
${OCm().filter(o=>o.st=="aberta").map(o=>`<div class="oc al"><b>⚠️ Cliente reportou problema no pedido #${o.ped} da loja ${nmS(o.lj)}</b><div class="meta">Motivo: ${o.mot}</div><button class="cta b" onclick="go('oc')">Ver ocorrência</button></div>`).join("")}
`}
function lj(){if(open)return det(L.find(x=>x.id==open));const sus=L.filter(x=>x.sus).length;
return `<h2>🏪 Lojas</h2><div class="grid">${tile(L.length,"lojas no sistema")}${tile(L.length-sus,"ativas")}${tile(sus,"suspensas")}${tile(L.filter(entOn).length,"com entrega ligada")}</div>
<div class="oc"><b>➕ Trazer uma loja</b><div class="meta" style="margin:6px 0">A loja agora é criada por você: toque em <b>👥 RH</b> na barra de cima → <b>Nova loja</b>, escolha o plano e envie o link de Gerente.</div><button class="cta" onclick="PA_RH.adm()">👥 Abrir RH e criar loja</button></div>
<div class="meta" style="margin:10px 0 4px">Toque numa loja para abrir as configurações dela.</div>
${LERR?`<div class="oc al"><b>Não foi possível carregar as suas lojas</b><div class="meta">${LERR} — confira se as regras do Firestore foram publicadas.</div></div>`:!LOADED?`<div class="meta">Carregando suas lojas…</div>`:!L.length?`<div class="oc"><div class="meta">Nenhuma loja ainda. Crie uma em 👥 RH → Nova loja.</div></div>`:""}${L.map(x=>`<button class="card" onclick="open=${x.id};draw()"><div style="flex:1"><div class="row"><b>${x.n}</b>${x.sus?`<span class="tag" style="color:var(--rd)">Suspensa</span>`:""}</div><div class="meta">${x.tp=="agenda"?"📅 Agendamento":"🛍️ Produtos"} · ${entOn(x)?"🛵 entrega ligada":"🏪 só retirada"}</div><div style="margin-top:6px">${bdg(x)}</div></div>›</button>`).join("")}`}
function det(x){const on=entOn(x),ag=x.tp=="agenda";return `<button class="back" onclick="open=null;draw()">‹ Todas as lojas</button>
<div class="oc"><div class="row"><b style="font-size:19px">${x.n}</b>${x.sus?`<span class="tag" style="color:var(--rd)">Suspensa</span>`:""}</div><div class="meta">${ag?"📅 Modelo Agendamento":"🛍️ Modelo Produtos"} · ${x.ped} pedidos · ${R$(x.fat)} faturados</div><div style="margin-top:8px">${bdg(x)}</div></div>
<div class="oc"><b>🛵 Serviço de Entrega</b><div class="meta" style="margin:4px 0 0">${ag?"Loja de Agendamento não usa entrega.":on?"LIGADO pela loja: o cliente pode escolher entrega.":"DESLIGADO pela loja: o cliente só vê Retirada na loja."}</div></div>
<div class="oc"><b>📄 Plano e vencimento</b><div class="meta" style="margin-top:6px">Plano ${(PA_PLANOS[x.plano]||{}).n||""} · ${x.conta?"vence "+fd(PA_estado(x.conta,Date.now()).v):"carregando…"}</div><input id="pv${x.id}" type="date" value="${x.conta?iso(new Date(PA_estado(x.conta,Date.now()).v)):""}"><div class="meta" style="margin-top:6px">Só o ADM escolhe a data. Não pode passar de 35 dias da entrada e só pode mudar 2 vezes (usadas: ${x.conta&&x.conta.admAlt||0}). Acima disso, só falando com o Criador. Os ciclos seguintes mantêm a mesma data.</div><button class="cta b" onclick="salvaPlano(${x.id})">Salvar plano</button></div>
<button class="cta ${x.sus?'':'o'}" onclick="susp(${x.id})">${x.sus?"Reativar loja":"Suspender loja"}</button>
<div class="oc" style="margin-top:12px"><b>Como o cliente vê esta loja</b><div class="meta">${x.sus?"⛔ Loja suspensa: o cliente não consegue pedir":on?"Entrega grátis · escolhe endereço":"🏪 Só retirada na loja · sem taxa e sem endereço"}</div></div>`}
function eq(){return `<h2>🔑 Acessos</h2><div class="oc"><div class="meta">Funcionários cadastrados pelos Gerentes aguardam a sua autorização. Você escolhe o cargo e libera.</div><b style="font-size:20px">${(window.PA&&PA.rhN)||0} aguardando</b><button class="cta" onclick="PA_RH.adm()">👥 Abrir RH (autorizar, cargos, folha)</button></div>`}
function fin(){return `<h2>💰 Financeiro</h2><div class="grid">${tile(R$(L.reduce((s,x)=>s+x.fat30,0)),"faturado (30 dias)")}${tile(R$(L.reduce((s,x)=>s+x.fat,0)),"faturado (total)")}</div>
<div class="oc"><b>Por loja</b><table><tr><th>Loja</th><th>30 dias</th><th>Total</th></tr>${L.map(x=>`<tr><td>${x.n}${x.sus?" ⛔":""}</td><td>${R$(x.fat30)}</td><td>${R$(x.fat)}</td></tr>`).join("")||`<tr><td colspan="3" class="meta">Nenhuma loja ainda.</td></tr>`}</table><div class="meta" style="margin-top:6px">Só pedidos entregues ou retirados.</div></div><button class="cta b" onclick="bk=true;go('cfg')">⬇ Relatório do contador (PDF)</button>
`}
function cfg(){return `<h2>⚙️ Config</h2><div class="oc"><b>🛵 Entregas</b><div class="meta" style="margin:4px 0 8px">${ENTG?"LIGADO: os ganhos por entrega aparecem abaixo e no Financeiro.":"DESLIGADO: ganhos por entrega e repasse aos entregadores ficam escondidos. Ligue para abrir."}</div><button class="cta ${ENTG?"o":"g"}" onclick="ENTG=!ENTG;draw();toast(ENTG?'Entregas ligadas':'Entregas desligadas')">${ENTG?"Desligar entregas":"Ligar entregas"}</button></div><div class="oc"><b style="color:var(--mu)">🛍️ Marketplace</b><div class="meta" style="margin:4px 0">Desligado</div><div class="meta">Quem liga ou desliga é o Criador.</div></div>

${ENTG?`<div class="oc"><b>🛵 Ganho do entregador por distância</b><div class="meta" style="margin:4px 0 8px">O app mede a distância pelo GPS da loja e do cliente e mostra ao entregador, antes de aceitar: quanto ele ganha, quantos km são e o tempo médio da corrida (deslocamento até a loja, espera e entrega).</div>
<div class="meta">Raio Máximo Global da Rede (km)</div><input id="erm" inputmode="decimal" value="${String(ENT.raio).replace(".",",")}"><div class="meta" style="margin-bottom:6px">Nenhuma loja pode definir um raio de entrega maior que este.</div>
<div class="meta">Valor por km (R$)</div><input id="ekm" inputmode="decimal" value="${String(ENT.km).replace(".",",")}" oninput="sim()">
<div class="meta">Ganho mínimo por entrega (R$)</div><input id="emin" inputmode="decimal" value="${String(ENT.min).replace(".",",")}" oninput="sim()">
<div class="meta">Velocidade média do entregador (km/h)</div><input id="evel" inputmode="decimal" value="${ENT.vel}" oninput="sim()">
<div class="meta">Tempo médio de espera na loja (min)</div><input id="eesp" inputmode="numeric" value="${ENT.esp}" oninput="sim()">
<button class="cta" onclick="salvaEnt()">Salvar regra de ganho</button>
<div class="meta" style="margin-top:12px;font-weight:800">Simulador (como o entregador vai ver)</div>
<div class="row" style="gap:8px"><div style="flex:1"><div class="meta">Entregador → loja (km)</div><input id="s1" inputmode="decimal" value="1,5" oninput="sim()"></div><div style="flex:1"><div class="meta">Loja → cliente (km)</div><input id="s2" inputmode="decimal" value="4,0" oninput="sim()"></div></div>
<div class="oc" id="sr" style="margin-bottom:0"></div></div>`:""}
<div class="oc"><b>💾 Relatório da administração</b><div class="meta">Balanço das lojas vinculadas a você (pedidos, faturamento e situação do plano), em PDF.</div><button class="cta b" onclick="bk=!bk;draw()">Gerar relatório</button>${bk?`<div class="meta" style="margin-top:8px"><b>Relatório pronto · PDF</b></div><button class="cta b" onclick="bkAcao('ver')">👁️ Visualizar</button><button class="cta b" onclick="bkAcao('imp')">🖨️ Imprimir</button><button class="cta b" onclick="bkAcao('salvar')">💾 Salvar em PDF</button><button class="cta b" onclick="bkAcao('share')">📤 Compartilhar</button><input id="bkem" type="email" inputmode="email" placeholder="E-mail do contador" value="${bkMail()}"><button class="cta" onclick="bkAcao('contador')">📧 Enviar ao contador</button>`:""}</div>
<div class="oc"><b>🤝 Indicação Comissionada</b><div class="meta" style="margin:4px 0">Para trazer uma loja use 👥 RH → Nova loja (o link de Gerente já leva o seu vínculo). O código abaixo identifica você nas indicações. Comissão de 1 nível, só sobre pagamento efetivo, repassada no ato do pagamento da loja. No período grátis ninguém recebe.</div><div class="meta">Terceiro: Por uso R$ 0,50/pedido por 3 meses · Mensal 100% do 1º mês · Anual 20% do total. Autoindicação: Por uso R$ 0,50/pedido · Mensal 50% · Anual 20%.</div><div class="oc" style="margin-bottom:0"><div class="meta">Seu código</div><b style="font-size:20px">${MYCODE||"gerando…"}</b></div><button class="cta" onclick="copiaAdm('cod')">Copiar código</button></div>
<div class="oc"><b>🔔 Notificações sonoras</b><div class="meta" style="margin:4px 0">💰 “Plim plim” quando o pagamento é confirmado. ⚠️ Alerta (som diferente) em atraso ou carência. Tocam no ADM e no Criador.</div><div style="display:flex;gap:8px"><button class="cta b" onclick="som('plim');toast('💰 Pagamento confirmado')">Testar plim plim</button><button class="cta b" onclick="som('alerta');toast('⚠️ Atraso / carência')">Testar alerta</button></div></div>
<div class="oc"><b>📋 Regras de cobrança</b><div class="meta" style="margin-top:4px">7 dias grátis dentro dos 30 (não somam); cancela sem pagar até o dia 7; 1º pagamento no dia 30. Quem cancela e volta paga desde o início. Carência de 3 dias após o vencimento, com 3 a 4 avisos por dia. Depois dela a loja para só de pedidos novos: pode mexer no estoque e acessar o painel, e só volta a vender pagando. Troca de plano: pagamento integral na hora, sem crédito do período não usado, dados preservados.</div></div>
<div style="text-align:center;margin-top:18px"><button style="background:none;border:0;color:var(--mu);font:inherit;font-size:14.5px;text-decoration:underline" onclick="fc=!fc;draw()">Falar com o Criador / Desenvolvedor</button></div>${fc?`<div class="oc"><b>Mensagem ao Criador</b><input id="fcm" placeholder="Escreva sua mensagem"><button class="cta" onclick="if(!$('fcm').value.trim()){toast('Escreva a mensagem');return}fc=false;draw();toast('Mensagem enviada ao Criador (dentro do app)')">Enviar</button></div>`:""}`}
/* ---------- PIX EM 2 ETAPAS ---------- */
const ADMLINK=()=>(/^https?:/.test(location.origin)?location.origin:"https://pedeakibrasil.vercel.app")+"/lojista.html?adm="+encodeURIComponent(MYCODE||"");
function copiaAdm(k){if(!MYCODE){toast("Seu código ainda está sendo gerado");return}PA_copia(k=="cod"?MYCODE:ADMLINK())}
const CHAVE_CRIADOR="criador@pedeai.exemplo";
let PIX=[];
const lojaNome=id=>(L.find(x=>x.id==id)||{}).n;
function pix(){const pe=PIX.filter(p=>p.st=="pend"),an=PIX.filter(p=>p.st=="analise"),ok=PIX.filter(p=>p.st=="ok");
 return `<h2>💠 Pix</h2><div class="meta">Pagamento em 2 etapas: o ADM confere o Pix e confirma, e a loja é liberada na hora. O Pix fica “Em análise” até o Criador bater o martelo.</div>
<div class="oc"><b>Chave Pix do Criador</b><div style="word-break:break-all;margin-top:4px">${CHAVE_CRIADOR}</div><button class="cta" onclick="copiaPix()">📋 Copiar chave Pix do Criador</button><div class="meta" style="margin-top:6px">Passe esta chave à loja para pagar o plano.</div></div>
