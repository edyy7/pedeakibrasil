<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agendar horário</title>
<style>
:root{--ac:#d4141c;--on:#fff;--bg:#0b0b0d;--tx:#f4f4f6;--card:#16161a;--br:#2a2a31;--mu:#a3a3ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,sans-serif;padding:16px 16px 48px}
.wrap{max-width:520px;margin:0 auto}.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:14px;margin:12px 0}
.meta{color:var(--mu);font-size:14px}.marca.cen{text-align:center}.marca.esq{text-align:left}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--br);background:#0b0b0d;color:var(--tx);font:inherit;margin-top:6px}
.cta{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font:800 16px system-ui;cursor:pointer;margin-top:10px}
.cta:disabled{opacity:.5}.opt{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--br);border-radius:12px;margin-top:8px}
.opt.on{border-color:var(--ac)}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
.slots button{padding:10px;border-radius:10px;border:1px solid var(--br);background:transparent;color:var(--tx);font:inherit}
.slots button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}.slots button:disabled{opacity:.35;text-decoration:line-through}
.foto{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:8px}
</style></head><body><div class="wrap" id="app">Carregando…</div>
<script src="marca.js"></script>
<script type="module">
import * as A from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import * as F from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import * as H from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
const CFG={apiKey:"AIzaSyCXq4-VbJUwypuC6H5jzw5cri5N4fqo-sw",authDomain:/\.vercel\.app$/.test(location.hostname)?location.host:"delivery-67d14.firebaseapp.com",projectId:"delivery-67d14",storageBucket:"delivery-67d14.firebasestorage.app",messagingSenderId:"684086028448",appId:"1:684086028448:web:9e86061b8e29e947eac1c5",measurementId:"G-KYQRSY9V5H"};
const app=A.initializeApp(CFG),db=F.getFirestore(app),au=H.getAuth(app);
const q=new URLSearchParams(location.search).get("loja")||"";
const $=i=>document.getElementById(i),esc=MARCA.esc,R$=n=>"R$ "+Number(n).toFixed(2).replace(".",",");
const ymd=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
let LJ=null,SRV=[],SEL=null,DIA="",HORA="",OCU=new Set(),WATCH=null;
const app$=()=>$("app");
function msg(t){app$().innerHTML=`<div class="card">${esc(t)}</div>`}
function login(){H.signInWithPopup(au,new H.GoogleAuthProvider()).catch(e=>{console.error(e);alert("Não foi possível entrar com o Google. Tente de novo.")})}
function slots(){const g=LJ.agenda||{},ini=(g.ini||"09:00").split(":").map(Number),fim=(g.fim||"18:00").split(":").map(Number),int=g.intervalo||30,dur=SEL?SEL.min:int;const out=[];let t=ini[0]*60+ini[1];const end=fim[0]*60+fim[1];
 while(t+dur<=end){out.push(String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"));t+=int}return out}
async function loadOcu(){if(!DIA||!q)return;const s=await F.getDocs(F.query(F.collection(db,"ocupados"),F.where("loja","==",q),F.where("data","==",DIA)));OCU=new Set(s.docs.map(d=>d.data().hora))}
function draw(){
 const g=LJ.agenda||{},min=ymd(new Date()),max=(()=>{const d=new Date();d.setDate(d.getDate()+30);return ymd(d)})();
 const h=`<div class="card">${MARCA.html(LJ.brand,LJ.nome)}<b style="font-size:22px">${esc(LJ.nome||q)}</b>${g.fotoUrl?`<img class="foto" src="${esc(g.fotoUrl)}" alt="">`:""}${g.bio?`<div style="margin-top:8px">${esc(g.bio)}</div>`:""}</div>
 <div class="card"><b>1. Serviço</b>${SRV.map(s=>`<label class="opt ${SEL&&SEL.id===s.id?"on":""}"><input type="radio" name="sv" value="${esc(s.id)}" ${SEL&&SEL.id===s.id?"checked":""} style="width:20px;height:20px"><span style="flex:1"><b>${esc(s.nome)}</b><div class="meta">${s.min} min · ${R$(s.preco)}</div></span></label>`).join("")||`<div class="meta">Nenhum serviço disponível.</div>`}</div>
 <div class="card"><b>2. Dia e horário</b><input id="dia" type="date" min="${min}" max="${max}" value="${DIA}"><div class="slots">${DIA&&SEL?slots().map(t=>`<button class="${HORA===t?"on":""}" data-h="${t}" ${OCU.has(t)?"disabled":""}>${t}</button>`).join("")||"":""}</div>${!SEL?`<div class="meta">Escolha o serviço primeiro.</div>`:""}${SEL&&!DIA?`<div class="meta">Escolha o dia.</div>`:""}</div>
 <div class="card"><b>3. Seus dados</b><input id="nm" maxlength="80" placeholder="Nome completo" value="${esc(localStorage.getItem("pa_nome")||"")}"><input id="tl" type="tel" inputmode="tel" maxlength="20" placeholder="Telefone / WhatsApp (com DDD)">${(g.pgto||"local")==="gateway"?`<input id="cp" inputmode="numeric" maxlength="18" placeholder="CPF ou CNPJ (para gerar o Pix)">`:""}
 <button class="cta" onclick="agendar()">Agendar horário</button><div class="meta" style="margin-top:8px">${({gateway:"Pagamento: Pix automático (sinal) pelo link.",pix:"Pagamento: Pix direto com a chave da loja, confirmado pela loja.",local:"Pagamento: no local, no atendimento."})[g.pgto||"local"]}</div></div>`;
 app$().innerHTML=h;
 document.querySelectorAll('input[name=sv]').forEach(r=>r.onchange=()=>{SEL=SRV.find(s=>s.id===r.value);HORA="";draw()});
 $("dia").onchange=async e=>{DIA=e.target.value;HORA="";await loadOcu();draw()};
 document.querySelectorAll(".slots button").forEach(b=>b.onclick=()=>{HORA=b.dataset.h;draw()});
}
async function agendar(){
 const u=au.currentUser;if(!u){login();return}
 const nome=$("nm").value.trim(),tel=$("tl").value.trim(),cpf=($("cp")?$("cp").value:"").trim(),g=LJ.agenda||{},pgto=g.pgto||"local";
 if(!SEL){alert("Escolha o serviço");return}if(!DIA){alert("Escolha o dia");return}if(!HORA){alert("Escolha um horário");return}
 if(nome.length<3){alert("Informe seu nome completo");return}if(tel.replace(/\D/g,"").length<10){alert("Informe um telefone com DDD");return}
 if(pgto==="gateway"&&cpf.replace(/\D/g,"").length<11){alert("Informe seu CPF ou CNPJ para gerar o Pix");return}
 localStorage.setItem("pa_nome",nome);
 const id=q+"__"+DIA+"__"+HORA.slice(0,2)+HORA.slice(3,5),ref=F.doc(db,"agendamentos",id);
 const status=pgto==="local"?"confirmado":pgto==="pix"?"aguardando_confirmacao":"aguardando_pagamento";
 try{const b=F.writeBatch(db);b.set(ref,{loja:q,servicoId:SEL.id,servicoNome:SEL.nome,data:DIA,hora:HORA,uid:u.uid,nomeCli:nome,telCli:tel,pgto,status,criadoEm:Date.now()});b.set(F.doc(db,"ocupados",id),{loja:q,data:DIA,hora:HORA});await b.commit()}
 catch(e){console.error(e);alert("Este horário acabou de ser reservado. Escolha outro.");HORA="";await loadOcu();draw();return}
 if(pgto==="local"){msg(`Agendado! ${SEL.nome} em ${DIA} às ${HORA}. Você paga no atendimento.`);return}
 if(pgto==="pix"){app$().innerHTML=`<div class="card"><b>Agendamento reservado</b><div class="meta" style="margin:6px 0">Faça o Pix de ${R$(SEL.preco)} para a chave abaixo. A loja confirma o recebimento.</div><textarea readonly rows="2" onclick="this.select()">${esc(g.pix||"")}</textarea></div>`;return}
 app$().innerHTML=`<div class="card">Gerando o Pix…</div>`;
 try{const tok=await u.getIdToken();const r=await fetch("/api/asaas",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify({tipo:"agenda",id,cpf})});const j=await r.json();
  if(!r.ok){app$().innerHTML=`<div class="card">${esc(j.erro||"Não foi possível gerar o Pix.")} Seu horário ficou reservado: a loja pode cancelar se precisar.</div>`;return}
  app$().innerHTML=`<div class="card"><b>Pague o Pix para confirmar</b><div class="meta" style="margin:6px 0">${esc(SEL.nome)} · ${DIA} às ${HORA} · ${R$(SEL.preco)}</div>${j.img?`<img src="data:image/png;base64,${j.img}" alt="QR Pix" style="width:220px;max-width:100%;display:block;margin:8px auto">`:""}<textarea readonly rows="3" onclick="this.select()">${esc(j.payload)}</textarea><div class="meta" id="stt">Aguardando pagamento…</div></div>`;
  if(WATCH)WATCH();WATCH=F.onSnapshot(ref,s=>{const d=s.data();if(d&&d.status==="confirmado"){$("stt").innerHTML="<b>Pagamento confirmado. Até lá!</b>"}})}
 catch(e){console.error(e);msg("Não foi possível gerar o Pix agora. Seu horário ficou reservado: tente pelo link de novo ou fale com a loja.")}
}
window.agendar=agendar;
H.onAuthStateChanged(au,async u=>{
 if(!u){app$().innerHTML=`<div class="card"><b>Entre com sua conta Google para agendar.</b><button class="cta" onclick="login()">Entrar com Google</button></div>`;window.login=login;return}
 if(LJ)return;
 if(!q){msg("Link inválido.");return}
 try{const s=await F.getDoc(F.doc(db,"lojas",q));
  if(!s.exists()){msg("Loja não encontrada.");return}
  LJ=s.data();
  if(!(LJ.modulos&&LJ.modulos.agenda===true)){msg("Esta loja não está com agendamento online no momento.");return}
  const sv=await F.getDocs(F.query(F.collection(db,"servicos"),F.where("loja","==",q)));SRV=sv.docs.map(d=>({id:d.id,...d.data()}));
  MARCA.aplica(LJ.brand||{});draw()}
 catch(e){console.error(e);msg("Não foi possível carregar a agenda. Tente de novo.")}
});
window.login=login;
</script></body></html>
